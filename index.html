function measureTable(providers){
 const rows=(DB.connections||[]).filter(c=>providers.includes(c.provider));
 if(!rows.length)return `<div class="empty"><div class="ei">${ic('link')}</div><h4>Chưa có kênh nào</h4><div class="mini" style="margin-bottom:12px">Thêm và kết nối kênh ở Thiết lập &gt; Kết nối kênh.</div><button class="btn primary" onclick="go('settings','integ')">${ic('plus')} Thêm kênh</button></div>`;
 const labels=[];
 rows.forEach(c=>(c.metrics&&c.metrics.items||[]).forEach(it=>{if(!labels.find(l=>l.label===it.label))labels.push({label:it.label,fmt:it.fmt})}));
 const val=(c,l)=>{const it=(c.metrics&&c.metrics.items||[]).find(x=>x.label===l.label);return it?it:null};
 const summable=l=>l.fmt!=='pct'&&!/^(CPC|CPL)$/.test(l.label);
 const st=statsGet(30),hist={};if(st&&st.channels)st.channels.connections.forEach(h=>hist[h.id]=h);
 const trend=c=>{if(!st)return '<span class="r-mut">…</span>';const h=hist[c.id];if(!h||h.points.length<2)return `<span class="r-mut" title="Cần số liệu ít nhất 2 ngày">${h?'1 ngày':'chưa có'}</span>`;const up=h.change>=0;return `<div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">${stSpark(h.points.map(p=>p.value),chType(c.provider).color)}<span class="mono" style="font-size:12px;color:${up?'var(--ok)':'var(--bad)'}">${up?'+':''}${h.change_pct!=null?h.change_pct+'%':stFmtKey(h.key,h.change)}</span></div>`};
 return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Kênh</th>${providers.length>1?'<th>Nền tảng</th>':''}<th>Trạng thái</th>${labels.map(l=>`<th class="tar">${esc(l.label)}</th>`).join('')}<th class="tar">Xu hướng 30 ngày</th><th>Cập nhật</th></tr></thead><tbody>
  ${rows.map(c=>`<tr class="clk" title="Xem lịch sử số liệu" onclick="openChannelHistory('${esc(c.id)}')"><td><b>${esc(c.label)}</b><div class="r-mut mono">${esc(c.external_account_id||'')}</div></td>${providers.length>1?`<td><span class="chip">${chType(c.provider).short}</span></td>`:''}<td>${connStatusBadge(c)}</td>${labels.map(l=>{const it=val(c,l);return `<td class="tar mono">${it?fmtMetric(it):'—'}</td>`}).join('')}<td class="tar">${trend(c)}</td><td class="r-mut">${esc(fmtTs(c.last_synced_at))}</td></tr>`).join('')}
  </tbody>${labels.length?`<tfoot><tr><td${providers.length>1?' colspan=2':''}>Tổng ${rows.length} kênh</td><td></td>${labels.map(l=>`<td class="tar mono">${summable(l)?fmtMetric({fmt:l.fmt,value:rows.reduce((s,c)=>s+(Number((val(c,l)||{}).value)||0),0)}):''}</td>`).join('')}<td></td><td></td></tr></tfoot>`:''}</table></div>
  <div class="mini" style="margin-top:8px">Bấm vào một kênh để xem toàn bộ lịch sử. Xu hướng lấy từ lịch sử đồng bộ hằng ngày (mỗi kênh tối đa 1 bản/ngày).</div>${rows.map(c=>channelDetail(c,hist)).join('')}`;
}

function pubUtm(link,prov,camp,pid){
 if(!link)return '';let frag='';const hi=link.indexOf('#');if(hi>=0){frag=link.slice(hi);link=link.slice(0,hi)}
 const qi=link.indexOf('?'),qs=qi>=0?link.slice(qi+1):'',base=qi>=0?link.slice(0,qi):link;
 const have=new Set(qs?qs.split('&').map(p=>decodeURIComponent(p.split('=')[0]).toLowerCase()):[]);
 const add=[['utm_source',{facebook_page:'facebook',instagram:'instagram',youtube:'youtube',tiktok:'tiktok'}[prov]||prov],['utm_medium','social']];if(camp)add.push(['utm_campaign',camp.toLowerCase()]);add.push(['utm_content',(pid||'<mã bài>').toLowerCase()]);
 const ex=add.filter(a=>!have.has(a[0])).map(a=>a[0]+'='+(a[1].startsWith('<')?a[1]:encodeURIComponent(a[1])));
 return ex.length?base+'?'+(qs?qs+'&':'')+ex.join('&')+frag:link+frag;
}

 return ps.map(p=>`<div class="mini mono" style="word-break:break-all">${pubTag(p)} ${esc(pubUtm(link,p,d.campaign_id,d.id))}</div>`).join('')}

async function pubUpload(files){
 const P=pubS();files=[...files];
 for(const f of files){
  const ext=(f.name.split('.').pop()||'').toLowerCase(),vid=['mp4','mov'].includes(ext);
  if(!['jpg','jpeg','png','webp','gif','mp4','mov'].includes(ext)){toast('Không nhận file này',esc(f.name)+' — chỉ ảnh JPG/PNG/WEBP/GIF hoặc video MP4/MOV');continue}
  if(f.size>(vid?200:8)*1048576){toast('File quá lớn',esc(f.name)+' — '+(vid?'video tối đa 200 MB':'ảnh tối đa 8 MB'));continue}
  P.up++;pubPart('pub-media',pubMediaHtml);
  try{const fd=new FormData();fd.append('file',f);const r=await fetch('/api/upload.php',{method:'POST',credentials:'same-origin',headers:PH(),body:fd});const j=await r.json().catch(()=>({}));

 }

 try{

 if(['approved','scheduled'].includes(p.status)&&pubCanAppr(p))a.push(b('danger','Từ chối',`pubReject('${id}')`,'x'));

function pubWeekHtml(){

 const today=P.now?P.now.slice(0,10):ymd(new Date());

 const tm=p=>p.scheduled_at&&!p.published_at?p.scheduled_at.slice(11,16):(()=>{const d=utcDate(p.published_at);return d&&!isNaN(d)?new Date(d.getTime()+7*3600e3).toISOString().slice(11,16):''})();

  <div class="pub-week">${days.map(d=>{const k=ymd(d),ev=(by[k]||[]).sort((a,b)=>tm(a).localeCompare(tm(b)));return `<div class="pub-day ${k===today?'today':''}"><h5>${['T2','T3','T4','T5','T6','T7','CN'][(d.getDay()+6)%7]} ${d.getDate()}/${d.getMonth()+1}</h5>

}

const CARE={loaded:false,busy:false,err:'',list:[],counts:{},sources:[],staff:[],lastCron:null,f:{status:'open',provider:'',q:''},draft:{},sug:{},fetching:false};
const CMST={new:{t:'Mới',c:'info'},escalated:{t:'Chuyển trưởng nhóm',c:'warn'},replied:{t:'Đã trả lời',c:'ok'},hidden:{t:'Đã ẩn',c:'mut'},ignored:{t:'Bỏ qua',c:'mut'}};

async function careLoad(){
 if(CARE.busy)return;CARE.busy=true;
 try{const f=CARE.f,q=new URLSearchParams({status:f.status});if(f.provider)q.set('provider',f.provider);if(f.q)q.set('q',f.q);

 catch(e){CARE.err=e.message;CARE.loaded=true}
 CARE.busy=false;if(S.page==='care')render();
}

async function careFetch(cid){
 CARE.fetching=true;render();
 try{const d=await apiPost('/api/comments.php',{action:'fetch',connection_id:cid||''});
  const ok=d.results.filter(r=>r.ok),bad=d.results.filter(r=>!r.ok);
  toast(d.results.length?`Đã kéo ${ok.reduce((a,r)=>a+r.new,0)} bình luận mới`:'Chưa có kênh nào để kéo',bad.length?bad.map(r=>r.label+': '+r.error).join(' · '):ok.map(r=>r.label+': '+r.new+' mới').join(' · '))}
 catch(e){toast('Lỗi',e.message)}
 CARE.fetching=false;await careLoad();
}

function todayStr(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function dueLate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d||'')&&d<todayStr()}
function taskDone(t){const b=BOARDS[t.board];return (b&&b.cols[b.cols.length-1][0]===t.col)||t.life==='PUBLISHED'||t.life==='APPROVED'}
function utcDate(ts){return ts?new Date(String(ts).replace(' ','T')+'Z'):null}
function relTime(ts){const d=utcDate(ts);if(!d||isNaN(d))return 'chưa có';const s=Math.max(0,(Date.now()-d)/1000);if(s<60)return 'vừa xong';if(s<3600)return Math.floor(s/60)+' phút trước';if(s<86400)return Math.floor(s/3600)+' giờ trước';if(s<86400*7)return Math.floor(s/86400)+' ngày trước';return d.toLocaleDateString('vi-VN')}

function stPersonBody(id,s){

 const cont=DB.content.filter(c=>c.owner===id&&c.state!=='PUBLISHED');
 const nLate=open.filter(t=>dueLate(t.due)).length;
 const taskRows=open.map(t=>{const late=dueLate(t.due);const bd=BOARDS[t.board]||{name:t.board,cols:[]};const cl=bd.cols.find(c=>c[0]===t.col);return `<div class="topitem" style="cursor:pointer" onclick="openTask('${t.id}')"><span class="pri" style="background:${(PRI[t.pri]||PRI.P2).c};display:inline-grid">${esc(t.pri)}</span><div class="tn"><b>${esc(t.title)}</b><span>${esc(bd.name)} · ${esc(cl?cl[1]:t.col)}${t.apr==='PENDING'?' · chờ duyệt':''}</span></div><div class="mini ${late?'neg':''}" style="white-space:nowrap">${late?'Quá hạn · ':''}${esc(t.due||'—')}</div></div>`}).join('');
 const contRows=cont.map(c=>`<div class="topitem" style="cursor:pointer" onclick="openContentItem('${c.id}')"><div class="tn"><b>${esc(c.title)}</b><span>${esc(c.type||'')} · ${esc(c.channel||'')}</span></div>${badge(CONTST,c.state)}<div class="mini ${dueLate(c.due)&&c.state!=='APPROVED'?'neg':''}" style="white-space:nowrap;margin-left:8px">${esc(c.due||'—')}</div></div>`).join('');
 return `${s?`<div class="mini" style="margin-bottom:10px">Đăng nhập gần nhất: <b>${s.last_login_at?relTime(s.last_login_at):'chưa có'}</b> · hoạt động gần nhất: <b>${s.last_activity?relTime(s.last_activity):'chưa có'}</b></div>`:''}
  <div class="card"><div class="card-h">${ic('clipboard')}<h3>Việc đang mở</h3><span class="sub">${open.length} việc${nLate?' · <b class="neg">'+nLate+' quá hạn</b>':''}</span></div><div class="card-b" style="padding-top:4px;padding-bottom:4px">${taskRows||'<div class="mini" style="padding:12px 0">Không có việc đang mở</div>'}</div></div>

}

async function submitStaffForm(id){

 if(!body.name){err.textContent='Nhập họ tên';return}
 if(!id){if(!body.email){err.textContent='Nhập email đăng nhập';return}const pw=v('#sf-pw');if(pw&&pw.length<8){err.textContent='Mật khẩu cần tối thiểu 8 ký tự';return}body.password=pw}

/* ---------- Thống kê: tải & lưu tạm theo kỳ + phạm vi công ty/chi nhánh ---------- */
const STATS={cache:{},pending:{}};
const ST_COLORS=['#7c3aed','#2563eb','#0d9488','#db2777','#d97706','#0891b2','#65a30d','#6b7789'];
// Khoá cache gồm cả dấu thời gian đồng bộ của từng kênh → đồng bộ xong là tự tải lại số liệu mới.
function statsKey(r){return r+'|'+S.scope.co+'|'+S.scope.br+'|'+(DB.connections||[]).map(c=>c.id+':'+(c.last_synced_at||'')).join(',')}
function statsGet(r){
 const k=statsKey(r);if(STATS.cache[k])return STATS.cache[k];
 if(!STATS.pending[k]){
  STATS.pending[k]=1;
  const q='/api/stats.php?range='+r+(S.scope.co!=='all'?'&co='+encodeURIComponent(S.scope.co):'')+(S.scope.br!=='all'?'&br='+encodeURIComponent(S.scope.br):'');
  apiGet(q).then(d=>{STATS.cache[k]=d;return true}).catch(e=>{if(e.message==='unauth')return false;STATS.cache[k]={error:e.message};return true})
   .then(re=>{delete STATS.pending[k];if(re&&['reports','dashboard','channels'].includes(S.page))render()});
 }
 return null;
}
function statsRetry(){STATS.cache={};render()}
function setRepRange(r){S.repRange=r;render()}
function stLoading(){return `<div class="empty"><div class="ei">${ic('chart')}</div><h4>Đang tải số liệu…</h4></div>`}
function stErrorBox(m){return `<div class="empty"><div class="ei">${ic('alert')}</div><h4>Không tải được thống kê</h4><div class="mini" style="margin-bottom:12px">${esc(m)}</div><button class="btn" onclick="statsRetry()">Thử lại</button></div>`}
function stEmpty(t,h,icn,btn){return `<div class="empty" style="padding:30px 16px"><div class="ei">${ic(icn||'chart')}</div><h4>${t}</h4><div class="mini">${h||''}</div>${btn?`<div style="margin-top:12px">${btn}</div>`:''}</div>`}
function stSpark(vals,color){if(!vals||vals.length<2)return '';return `<span style="display:inline-block;width:110px;height:28px;vertical-align:middle">${chSpark(vals,color).replace('class="spark"','class="spark" style="margin:0;height:28px"')}</span>`}
function stToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtD(d){return d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):''}
function stDay(d){return d.slice(8,10)+'/'+d.slice(5,7)}
function stMon(m){return 'T'+(+m.slice(5,7))+'/'+m.slice(2,4)}
function stThin(labels,max){const k=Math.max(1,Math.ceil(labels.length/(max||12)));return labels.map((l,i)=>i%k===0?l:'')}
function fmtTs(s){if(!s)return 'chưa';if(!/^\d{4}-\d\d-\d\d \d\d:\d\d/.test(s))return s;const d=new Date(s.replace(' ','T')+'Z');return isNaN(d)?s:d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function stFmtKey(key,v){return key==='spend'?M(v)+'₫':num(Math.round(v))}
function stPct(a,b){return b?Math.round(a/b*1000)/10+'%':'—'}
function stTable(head,rows,foot){return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th${h[1]?' class="tar"':''}>${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody>${foot||''}</table></div>`}
function connMetric(c,key,label){const its=(c.metrics&&c.metrics.items)||[];const it=its.find(x=>x.key===key)||its.find(x=>!x.key&&x.label===label);return it?Number(it.value)||0:null}
/* Khối "Kênh" trên Bảng điều khiển: tổng hợp từ last_metrics của kênh đã kết nối. */
function dashChannels(s30){
 const cs=DB.connections||[];
 if(!cs.length)return `<div class="card" style="margin-bottom:16px"><div class="card-h">${ic('link')}<h3>Kênh</h3><div class="hact"><button class="btn sm" onclick="go('settings','integ')">Kết nối kênh</button></div></div><div class="card-b r-mut">Chưa kết nối Fanpage, YouTube, TikTok, website hay tài khoản quảng cáo nào — kết nối ở Thiết lập để theo dõi số liệu thật tại đây.</div></div>`;
 const con=cs.filter(c=>c.status==='connected'),err=cs.filter(c=>c.last_error||c.status==='error').length;

/* Lịch sử đầy đủ của một kênh (bấm từ Đo lường kênh / Báo cáo › Kênh). */
async function openChannelHistory(id){
 const c=(DB.connections||[]).find(x=>x.id===id)||{label:id,provider:''};
 const hd=`<div class="mh">${ic('trend')}<h3>Lịch sử số liệu — ${esc(c.label)}</h3><button class="x" onclick="closeLayer()">${ic('x')}</button></div>`;
 openModal(hd+`<div class="mb">${stLoading()}</div>`,'lg');
 let d;try{d=await apiGet('/api/stats.php?history='+encodeURIComponent(id)+'&range=365')}catch(e){if(e.message!=='unauth')openModal(hd+`<div class="mb">${stErrorBox(e.message)}</div>`,'lg');return}
 S._hist=d;const rows=d.rows,t=chType(d.connection.provider),sp=d.key==='spend';
 if(!rows.length){openModal(hd+`<div class="mb">${stEmpty('Chưa có lịch sử','Đồng bộ kênh mỗi ngày để có biểu đồ theo thời gian (mỗi kênh lưu 1 bản/ngày).','trend')}</div><div class="mf"><button class="btn" onclick="closeLayer()">Đóng</button></div>`,'lg');return}
 const labels=[];rows.forEach(r=>r.items.forEach(it=>{if(!labels.find(l=>l.label===it.label))labels.push({label:it.label,fmt:it.fmt})}));
 const kv=rows.filter(r=>r.key_value!=null);
 const chart=kv.length>1?chLine(stThin(kv.map(r=>stDay(r.day))),[{name:(d.key_label||'')+(sp?' (triệu ₫)':''),color:t.color,values:kv.map(r=>sp?Math.round(r.key_value/1e5)/10:r.key_value)}]):`<div class="r-mut" style="padding:6px 0">Cần số liệu ít nhất 2 ngày để vẽ biểu đồ.</div>`;
 const tb=stTable([['Ngày'],...labels.map(l=>[esc(l.label),1])],[...rows].reverse().map(r=>`<tr><td class="mono">${fmtD(r.day)}</td>${labels.map(l=>{const it=r.items.find(x=>x.label===l.label);return `<td class="tar mono">${it?fmtMetric(it):'—'}</td>`}).join('')}</tr>`));
 openModal(hd+`<div class="mb" style="max-height:70vh;overflow:auto"><div class="mini" style="margin-bottom:8px">${esc(t.name)} · ${rows.length} ngày có số liệu (${fmtD(rows[0].day)} → ${fmtD(rows[rows.length-1].day)})</div>${chart}<div style="margin-top:14px">${tb}</div></div><div class="mf"><button class="btn" onclick="exportChannelHistory()">${ic('download')} Xuất Excel</button><button class="btn" onclick="closeLayer()">Đóng</button></div>`,'lg');
}
function exportChannelHistory(){
 const d=S._hist;if(!d||!d.rows.length)return;
 const labels=[];d.rows.forEach(r=>r.items.forEach(it=>{if(!labels.includes(it.label))labels.push(it.label)}));
 dlCSV(['Ngày',...labels],d.rows.map(r=>[r.day,...labels.map(l=>{const it=r.items.find(x=>x.label===l);return it?it.value:''})]),'LichSu_'+(d.connection.label||d.connection.id).replace(/[^\p{L}\p{N}]+/gu,'_')+'.csv');
}

  <td><div class="rowact" style="flex-wrap:wrap">${acts}<button class="iconbtn" title="Xoá kênh" onclick="deleteChannel('${c.id}')">${ic('trash')}</button></div></td>

  <textarea class="cf-in mono" id="cf-rt" rows="2" placeholder="${c&&c.has_refresh?'Refresh Token — để trống = giữ cái đang dùng':'Refresh Token'}"></textarea>`:''}
  <textarea class="cf-in mono" id="cf-secret" ${t.provider==='gbp'||t.provider==='zalo_oa'?'style="display:none"':''} rows="${f.rows}" placeholder="${esc(c&&c.secret_hint?'Để trống = giữ '+(t.provider==='ga4'||t.provider==='gsc'?'file JSON':t.provider==='youtube'?'API key':'token')+' đang dùng ('+(c.secret_hint||'')+')':f.secret)}"></textarea>

async function quickWeb(urlArg){

 if(!r.ok){if(w)w.close();toast('Không kết nối được',d.error||('Lỗi '+r.status));return}

   if(c.provider==='facebook_page')autoImportAll(c).then(r=>{if(r==='err')pickAccounts(c.id)});
   else pickAccounts(c.id);
  }
 });
});

async function autoImportAll(c){
 try{
  toast('Đang thêm Fanpage…','Lấy danh sách Trang từ Facebook');
  const la=await apiPost('/api/connections.php',{action:'list_accounts',id:c.id});
  const taken=new Set(DB.connections.filter(x=>x.provider===c.provider&&x.id!==c.id).map(x=>x.external_account_id));
  const list=(la.accounts||[]).filter(a=>!taken.has(a.id));
  if(!list.length){
   toast('Không có Fanpage mới nào','Ở bước “Chọn Trang” của Facebook hãy chọn đúng Trang cần dùng (đã thêm rồi thì không lặp lại)');
   await refreshData();if(S.page==='settings')render();return 'empty';
  }
  await apiPost('/api/connections.php',{action:'import_accounts',id:c.id,accounts:list.map(a=>({id:a.id,name:a.name})),keep_own:false});
  await refreshData();
  toast('Đã thêm '+list.length+' Fanpage','Đang đồng bộ số liệu…');
  for(const x of DB.connections.filter(x=>x.provider===c.provider&&x.status==='connected'&&x.external_account_id&&!x.last_synced_at))await syncChannel(x.id,true);
  await refreshData();
  toast('Xong','Đã kết nối '+list.length+' Fanpage');
  if(S.page==='settings')render();
  return 'ok';
 }catch(e){toast('Chưa tự thêm được',e.message);return 'err'}
}

async function aiAsk(q){

 S.aiBusy=true;renderChat();
 let res=null,d={};
 try{res=await fetch('/api/ai_chat.php',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history,org:ORG.companies.map(c=>({id:c.id,name:c.name,branches:c.branches}))})});d=await res.json().catch(()=>({}))}catch(e){res=null}
 if(conv!==S.aiConv)return; // đã bấm "Cuộc mới" trong lúc chờ
 S.chat=S.chat.filter(m=>!m.typing);S.aiBusy=false;
 if(res&&res.status===401){renderLogin();return}
 if(res&&res.ok&&typeof d.reply==='string')S.chat.push({role:'ai',text:d.reply,reply:d.reply,data:{campaign_drafts:d.campaign_drafts||[],tasks:d.tasks||[]},model:d.model,provider:d.provider,q});

/* Markdown tối giản → HTML. Luôn escape trước, sau đó chỉ sinh thẻ không thuộc tính từ dữ liệu. */
function aiInline(s){return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<i>$2</i>')}
function aiMd(src){
 const L=esc(src||'').split(/\r?\n/);let out='',list=null,para=[];
 const fp=()=>{if(para.length){out+='<p>'+para.map(aiInline).join('<br>')+'</p>';para=[]}};
 const fl=()=>{if(list){out+=`<${list.t} style="margin:0 0 8px 20px">`+list.items.map(x=>'<li>'+aiInline(x)+'</li>').join('')+`</${list.t}>`;list=null}};
 const isRow=l=>/^\s*\|.*\|\s*$/.test(l),cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
 for(let i=0;i<L.length;i++){const l=L[i];let m;
  if(isRow(l)){fp();fl();const rows=[];while(i<L.length&&isRow(L[i]))rows.push(L[i++]);i--;const body=rows.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r));const h=body.shift()||'';
   out+='<div style="overflow-x:auto"><table class="mtbl"><thead><tr>'+cells(h).map(c=>'<th>'+aiInline(c)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+cells(r).map(c=>'<td>'+aiInline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
  if((m=l.match(/^\s*#{1,6}\s+(.*)$/))){fp();fl();out+='<h4>'+aiInline(m[1])+'</h4>';continue}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){fp();fl();out+='<hr style="border:0;border-top:1px dashed var(--line);margin:10px 0">';continue}
  if((m=l.match(/^\s*[-*•]\s+(.*)$/))){fp();if(!list||list.t!=='ul'){fl();list={t:'ul',items:[]}}list.items.push(m[1]);continue}
  if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){fp();if(!list||list.t!=='ol'){fl();list={t:'ol',items:[]}}list.items.push(m[1]);continue}
  if(!l.trim()){fp();fl();continue}
  fl();para.push(l)}
 fp();fl();return out;
}

 if(ts.length)h+=`<h4>${ic('clipboard')}Công việc đề xuất (${ts.length})</h4><div style="overflow-x:auto"><table class="mtbl"><thead><tr><th>Việc</th><th>Bảng</th><th>Người nhận</th><th>Ưu tiên</th><th>Hạn</th></tr></thead><tbody>${ts.map((t,k)=>`<tr><td>${esc(t.title)}${done[k]?' <span class="chip">đã giao</span>':''}</td><td>${esc((BOARDS[t.board]||{}).name||t.board)}</td><td>${esc(aiStaffName(t.assignee_id)||'—')}</td><td>${esc(t.pri)}</td><td>${esc(t.due||'—')}</td></tr>`).join('')}</tbody></table></div>`;
 h+=`<div class="plan-actions">`;

 if(ts.length)h+=`<button class="btn sm${cs.length?'':' primary'}" ${nT===ts.length?'disabled':''} onclick="aiAssign(${i})">${ic('clipboard')} ${nT===ts.length?'Đã giao '+nT+' việc':'Giao việc cho team'}</button>`;
 h+=`<button class="btn sm" onclick="aiExport(${i})">${ic('download')} Xuất kế hoạch</button>`;
 if(nC)h+=`<button class="btn sm" onclick="go('campaigns')">${ic('mega')} Mở Chiến dịch</button>`;
 h+=`</div>`;
 if(cs.length&&nC<cs.length)h+=`<p class="r-mut" style="margin-top:6px">Chiến dịch tạo ra ở trạng thái <b>Nháp · Chờ duyệt</b>. Nên tạo chiến dịch trước khi giao việc để công việc được gắn đúng chiến dịch.</p>`;
 return h;
}
function aiCo(co){return ORG.companies.some(c=>c.id===co)?co:'all'}
function aiBr(co,br){const c=ORG.companies.find(x=>x.id===co);return c&&c.branches.some(b=>b.id===br)?br:'all'}
async function aiCreateDrafts(i){
 const m=S.chat[i];if(!m||!m.data||m._busy)return;m._busy=true;m.camps=m.camps||{};
 let n=0,err=null;
 for(const [k,c] of m.data.campaign_drafts.entries()){
  if(m.camps[k])continue;
  try{const co=aiCo(c.co);const r=await apiPost('/api/campaigns.php',{name:c.name,subject:c.subject||'',co,br:co==='all'?'all':aiBr(co,c.br),budget:c.budget||0,start:c.start||null,end:c.end||null,channels:c.channels||[],obj:c.obj||'',state:'DRAFT'});m.camps[k]={id:r.id,name:c.name};n++}
  catch(e){err=e;break}
 }
 m._busy=false;
 if(err&&err.message==='unauth')return;
 if(n)toast('Đã tạo '+n+' chiến dịch nháp',err?'Có lỗi ở chiến dịch tiếp theo: '+err.message:'Đang chờ duyệt trong mục Chiến dịch');
 else if(err)toast('Chưa tạo được chiến dịch',err.message);
 if(n)await refreshData();else renderChat();
}
function aiResolveCamp(m,ref){
 if(!ref)return '';const r=String(ref).trim().toLowerCase();
 const mine=Object.values(m.camps||{}).find(c=>c.name.trim().toLowerCase()===r||c.id.toLowerCase()===r);if(mine)return mine.id;
 const ex=DB.campaigns.find(c=>c.id.toLowerCase()===r||String(c.name||'').trim().toLowerCase()===r);return ex?ex.id:'';
}

 const pendingDraft=m.data.tasks.some((t,k)=>!done[k]&&t.campaign_ref&&!aiResolveCamp(m,t.campaign_ref));
 const rows=m.data.tasks.map((t,k)=>{const camp=aiResolveCamp(m,t.campaign_ref);const dis=done[k]?'disabled':'';
  return `<div style="border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:10px;${done[k]?'opacity:.55':''}">

  </div>`}).join('');

  <div class="mb"><p class="r-mut" style="margin-bottom:10px">AI đề xuất ${m.data.tasks.length} việc. Kiểm tra người nhận, hạn và chiến dịch rồi bấm Giao việc — bỏ chọn việc nào không muốn giao.</p>${pendingDraft?`<div class="note warn" style="margin-top:0">Một số việc gắn với chiến dịch nháp chưa được tạo. Bấm <b>Tạo chiến dịch nháp</b> trước nếu muốn gắn việc vào chiến dịch mới.</div>`:''}${rows}</div>
  <div class="mf"><button class="btn" onclick="closeLayer()">Huỷ</button><button class="btn primary" id="ait-go" onclick="aiAssignSubmit(${i})">${ic('send')} Giao việc</button></div>`,'lg');
}
async function aiAssignSubmit(i){
 const m=S.chat[i];if(!m||!m.data)return;m.tasksDone=m.tasksDone||{};
 const jobs=[];
 for(const [k] of m.data.tasks.entries()){
  if(m.tasksDone[k])continue;const on=$('#ait-on-'+k);if(!on||!on.checked)continue;
  const title=$('#ait-title-'+k).value.trim(),assignee=$('#ait-as-'+k).value,board=$('#ait-board-'+k).value;
  if(!title){toast('Thiếu tiêu đề','Việc '+(k+1)+' chưa có tiêu đề');return}
  if(!assignee){toast('Chưa chọn người nhận','Việc '+(k+1)+': '+title);return}
  const camp=$('#ait-camp-'+k).value||null;const c=camp&&DB.campaigns.find(x=>x.id===camp);
  jobs.push([k,{title,board,col:BOARDS[board].cols[0][0],assignee,pri:$('#ait-pri-'+k).value,due:$('#ait-due-'+k).value||null,camp,co:c?c.co:'all',br:c?c.br:'all'}]);
 }
 if(!jobs.length){toast('Chưa chọn việc nào để giao');return}
 const btn=$('#ait-go');if(btn)btn.disabled=true;
 let n=0,err=null;
 for(const [k,body] of jobs){try{const r=await apiPost('/api/tasks.php',body);m.tasksDone[k]=r.id;n++}catch(e){err=e;break}}
 if(err&&err.message==='unauth')return;
 closeLayer();
 if(n)toast('Đã giao '+n+' việc',err?'Có lỗi ở việc tiếp theo: '+err.message:'Thông báo tới người nhận');else if(err)toast('Chưa giao được việc',err.message);
 if(n)await refreshData();else renderChat();
}

 const day=new Date().toISOString().slice(0,10),cell=v=>String(v==null?'':v).replace(/\|/g,'/').replace(/\n/g,' ');
 let md=`# Kế hoạch marketing — ${day}\n\n`;
 if(m.q)md+=`> Yêu cầu: ${m.q.replace(/\n/g,' ')}\n\n`;
 md+=m.reply+'\n';
 if(cs.length)md+=`\n## Chiến dịch nháp đề xuất\n\n| Chiến dịch | Sản phẩm | Ngân sách (đ) | Bắt đầu | Kết thúc | Kênh | Mục tiêu |\n|---|---|---:|---|---|---|---|\n`+cs.map(c=>`| ${cell(c.name)} | ${cell(c.subject)} | ${num(c.budget)} | ${cell(c.start)} | ${cell(c.end)} | ${cell((c.channels||[]).join(', '))} | ${cell(c.obj)} |`).join('\n')+'\n';
 if(ts.length)md+=`\n## Phân công công việc\n\n| Việc | Bảng | Người nhận | Ưu tiên | Hạn | Chiến dịch |\n|---|---|---|---|---|---|\n`+ts.map(t=>`| ${cell(t.title)} | ${cell((BOARDS[t.board]||{}).name||t.board)} | ${cell(aiStaffName(t.assignee_id))} | ${t.pri} | ${cell(t.due)} | ${cell(t.campaign_ref)} |`).join('\n')+'\n';
 md+=`\n---\nTạo bởi Trợ lý AI · Marketing Hub${m.model?' · '+m.model:''}\n`;
 const b=new Blob(['﻿'+md],{type:'text/markdown;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`ke-hoach-ai-${day}.md`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
 if(ts.length)dlCSV(['Việc','Bảng','Người nhận','Ưu tiên','Hạn','Chiến dịch'],ts.map(t=>[t.title,(BOARDS[t.board]||{}).name||t.board,aiStaffName(t.assignee_id),t.pri,t.due,t.campaign_ref]),`cong-viec-ai-${day}.csv`);
 else toast('Đã xuất kế hoạch',`ke-hoach-ai-${day}.md`);
}

function hq(key){if(!HELP[key])return '';return `<button class="hq" onclick="event.stopPropagation();openHelp('${key}')" onmouseenter="showTip(this,'${key}')" onmouseleave="hideTip()">?</button>`}
function showTip(el,key){const h=HELP[key];if(!h)return;hideTip();const t=document.createElement('div');t.className='hqtip';t.id='hqtip';t.innerHTML=`<b>${h.t}</b>${h.tip}<br><span style="opacity:.6">Nhấp để xem đầy đủ</span>`;document.body.appendChild(t);const r=el.getBoundingClientRect();let left=r.left+r.width/2-t.offsetWidth/2,top=r.bottom+9;if(left<8)left=8;if(left+t.offsetWidth>innerWidth-8)left=innerWidth-t.offsetWidth-8;if(top+t.offsetHeight>innerHeight-8)top=r.top-t.offsetHeight-9;t.style.left=left+'px';t.style.top=top+'px';requestAnimationFrame(()=>t.classList.add('show'))}
function hideTip(){const t=$('#hqtip');if(t)t.remove()}
function openHelp(key){const h=HELP[key];if(!h)return;hideTip();openModal(`<div class="mh">${ic('doc')}<h3>${h.t}</h3><button class="x" onclick="closeLayer()">${ic('x')}</button></div><div class="mb" style="max-height:66vh">${h.html()}</div><div class="mf"><button class="btn" onclick="closeLayer()">Đóng</button></div>`,'')}
function hqAttach(){const c=$('#content');if(!c)return;const h=c.querySelector('.pagehead h1');if(h&&HELP[S.page]&&!h.querySelector('.hq'))h.insertAdjacentHTML('beforeend',hq(S.page))}

/* Đổi dự án: huỷ dữ liệu đang giữ của dự án cũ, nạp lại từ đầu. Request cũ về muộn bị bỏ qua nhờ S.projSeq. */
async function switchProject(id){
 if(id==='__all'){go('portfolio');renderScope();return}
 if(id==='__new'){renderScope();projCreateForm();return}
 if(id===S.project)return;
 S.project=id;S.projSeq=(S.projSeq||0)+1;
 resetProjectCaches();
 try{await apiPost('/api/projects.php',{action:'select',id})}catch(e){toast('Không đổi được dự án',e.message);return}
 try{await loadData()}catch(e){toast('Lỗi tải dữ liệu',e.message);return}
 renderScope();renderSbFoot();renderNav();
 go('overview');
}

 if(sec==='acc'){if(!ZU.d)zuLoad();return `<h3 class="zs-t">Tài khoản Zalo</h3>${zaloUserCard()}`}

 if(!ZA.d){zaLoad();return '<div class="zw-load" style="min-height:300px">Đang tải cấu hình…</div>'}

 const c=ZA.cfg,adm=ZA.d.can_admin,dis=adm?'':' disabled',eng=ZA.d.engine||{};
 const head=`<div class="zs-ai"><div><b>AI tự trả lời tin Zalo</b><div class="mini">${eng.via==='none'?'⚠ ':'● '}${esc(eng.label||'')}</div></div><label class="za-main"><span>${c.enabled?'<b style="color:#16a34a">ĐANG BẬT</b>':'Đang tắt'}</span><span class="sw big"><input type="checkbox" ${c.enabled?'checked':''}${dis} onchange="zaSet('enabled',this.checked)"><span></span></span></label></div>`;
 if(sec==='ai_who'){
  if(!ZA.friends&&!ZA.fBusy&&!ZA.fTried){ZA.fTried=1;setTimeout(zaFriends,0)}

  return `${head}<h3 class="zs-t">Ai được trả lời</h3>

   ${adm?`<div class="za-pick"><div class="ib-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><input id="za-ph" inputmode="tel" placeholder="Hoặc tìm theo số điện thoại Zalo, VD 0912345678" onkeydown="if(event.key==='Enter')zaFind()"></div><button class="btn sm primary" onclick="zaFind()">Tìm</button></div>`:''}
   <div class="zs-list">${sel.map(p=>row(p,true)).join('')}${rest.map(p=>row(p,false)).join('')||(!sel.length?`<div class="mini" style="padding:10px">${ZA.friends?'Không thấy ai khớp':'Chưa thấy ai — bấm "Tải danh sách bạn bè" để chọn trong toàn bộ bạn Zalo'}</div>`:'')}</div>`}
 if(sec==='ai_topic')return `${head}<h3 class="zs-t">AI được trả lời gì</h3>
   <div class="field"><label>Chủ đề AI được phép trả lời <span class="mini">(AI tự hiểu ý, mỗi dòng một chủ đề)</span></label><textarea rows="6"${dis} placeholder="VD:&#10;- Báo giá sản phẩm / dịch vụ&#10;- Đặt lịch, lịch hẹn&#10;- Hỗ trợ đơn hàng" oninput="zaInput('topics',this)">${esc(c.topics)}</textarea></div>
   <label class="zs-row"><div><b>Ngoài các chủ đề trên thì AI im lặng</b><div class="mini">Để bạn tự trả lời chuyện khác. Tắt: AI trả lời ngắn là sẽ báo lại sau</div></div><span class="sw"><input type="checkbox" ${c.off_topic_silent?'checked':''}${dis} onchange="zaSet('off_topic_silent',this.checked)"><span></span></span></label>
   <div class="field"><label>Từ khoá bắt buộc <span class="mini">(tuỳ chọn — tin phải chứa ít nhất 1 từ, không phân biệt dấu; trống = bỏ qua)</span></label><input${dis} value="${esc(c.keywords)}" placeholder="VD: báo giá, đặt hàng, hỗ trợ" oninput="zaInput('keywords',this)"></div>
   <div class="field"><label>Thông tin AI được dùng để trả lời</label><textarea rows="6"${dis} placeholder="VD: Bảng giá… STK công ty… Giờ làm việc…" oninput="zaInput('knowledge',this)">${esc(c.knowledge)}</textarea></div>
   <label class="zs-row"><div><b>Dùng thêm thông tin dự án</b><div class="mini">Website, thương hiệu, sản phẩm/dịch vụ & giá trên web của dự án</div></div><span class="sw"><input type="checkbox" ${c.use_project?'checked':''}${dis} onchange="zaSet('use_project',this.checked)"><span></span></span></label>
   <div class="zs-note">Luôn cấm, không cần cài: đồng ý chuyển tiền/cho vay · gửi mã OTP/mật khẩu · hứa hẹn hay cam kết thay bạn · bịa giá/số liệu. Gặp chuyện tiền bạc/riêng tư → AI trả lời lịch sự và báo bạn.</div>`;
 if(sec==='ai_sales'){const pb=c.sales_playbook||ZA.d.sales_default||'';return `${head}<h3 class="zs-t">Kịch bản bán hàng</h3>
   <label class="zs-row"><div><b>AI đóng vai chuyên gia bán hàng</b><div class="mini">Tự phân tích nhu cầu và quyết định: hỏi thêm · gửi chi tiết dịch vụ · gửi báo giá · xin số điện thoại · đưa hotline · gửi dự án mẫu</div></div><span class="sw"><input type="checkbox" ${c.sales_mode?'checked':''}${dis} onchange="zaSet('sales_mode',this.checked)"><span></span></span></label>
   <div class="zs-flow">${[['1','Nhận diện nhu cầu','từ tin mới nhất + mạch chuyện'],['2','Chưa rõ → hỏi 1 câu','mục đích, quy mô, thời gian, ngân sách'],['3','Hỏi "làm gì" → chi tiết','2–3 lợi ích + link dịch vụ'],['4','Hỏi giá / rõ nhu cầu → báo giá','gói phù hợp nhất + link bảng giá'],['5','Có ý định → xin SĐT','để bạn gọi lại tư vấn'],['6','Gấp / ngoài giờ → hotline','hotline của dự án']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}<small>${x[2]}</small></span></div>`).join('')}</div>
   <div class="field"><label>Kịch bản chi tiết <span class="mini">(sửa theo cách anh/chị bán hàng — AI làm đúng theo đây)</span></label><textarea rows="16"${dis} style="font-size:13px;line-height:1.55" oninput="zaInput('sales_playbook',this)">${esc(pb)}</textarea>
    ${adm?`<button class="btn sm" style="margin-top:6px" onclick="ZA.cfg.sales_playbook='';ZA.dirty=true;render()">Khôi phục kịch bản mặc định</button>`:''}</div>
   <div class="zs-note">Giá, gói, link dịch vụ AI lấy từ website của dự án (mục "Dùng thêm thông tin dự án" ở phần Được trả lời gì). Khách để lại SĐT → tự tạo đầu mối (lead) và báo chuông/Telegram cho anh/chị ngay.</div>`}
 if(sec==='ai_talk')return `${head}<h3 class="zs-t">Cách nói chuyện</h3>
   <div class="field"><label>Xưng hô</label><select${dis} onchange="zaSet('xung_ho',this.value)">${['em-anh/chị','mình-bạn','tôi-bạn','anh-em','chị-em','tự nhiên'].map(x=>`<option ${c.xung_ho===x?'selected':''}>${x}</option>`).join('')}</select></div>
   <div class="field"><label>Vai trò & cách làm việc</label><textarea rows="5"${dis} placeholder="VD: Bạn là trợ lý của giám đốc. Với kế toán: trả lời về hoá đơn, công nợ; việc cần duyệt thì nói giám đốc sẽ duyệt trong ngày." oninput="zaInput('persona',this)">${esc(c.persona)}</textarea></div>
   <div class="field"><label>Chữ ký cuối tin <span class="mini">(tuỳ chọn)</span></label><input${dis} value="${esc(c.signature)}" placeholder="VD: — Trợ lý tự động" oninput="zaInput('signature',this)"></div>
   <div class="zs-note">Bị hỏi thẳng "có phải máy không" → AI nói thật là trợ lý tự động, bạn sẽ xem tin sau.</div>`;
 if(sec==='ai_limit')return `${head}<h3 class="zs-t">Giới hạn an toàn</h3>
   <div class="za-grid">
    <div class="field"><label>Hoạt động từ (giờ)</label><input type="number" min="0" max="23"${dis} value="${c.hour_from}" oninput="zaInput('hour_from',this)"></div>
    <div class="field"><label>Đến (giờ)</label><input type="number" min="1" max="24"${dis} value="${c.hour_to}" oninput="zaInput('hour_to',this)"></div>
    <div class="field"><label>Chờ trước khi trả lời (giây)</label><input type="number" min="0" max="120"${dis} value="${c.delay_sec}" oninput="zaInput('delay_sec',this)"><div class="mini">Gộp các tin nhắn liên tiếp</div></div>
    <div class="field"><label>Nhường tôi khi tôi đang nhắn (phút)</label><input type="number" min="0" max="1440"${dis} value="${c.quiet_min}" oninput="zaInput('quiet_min',this)"><div class="mini">0 = AI vẫn trả lời theo ngữ cảnh (khuyên dùng). AI luôn im nếu bạn đã tự trả lời tin mới nhất.</div></div>
    <div class="field"><label>Tối đa tin AI / người / ngày</label><input type="number" min="1" max="100"${dis} value="${c.max_per_day}" oninput="zaInput('max_per_day',this)"></div></div>`;
 if(sec==='ai_test'){const pool=(ZA.d.recent||[]),tr=ZA.testRes;return `${head}<h3 class="zs-t">Kiểm tra AI</h3>
   <div class="field"><label>Người gửi</label><select id="za-tu"><option value="">— Chọn —</option>${pool.map(p=>`<option value="${esc(p.uid)}" ${ZA.test.uid===p.uid?'selected':''}>${esc(p.name||p.uid)}</option>`).join('')}</select></div>

   <div class="zs-note">Chỉ kiểm tra điều kiện (người, từ khoá, giờ, giới hạn) — không gửi tin. Xem AI sẽ nói gì: mở cuộc chat → bấm 🤖 Gợi ý.</div>`}
 return '';
}
function zsModal(){const ai=ZS.sec.startsWith('ai_'),adm=ZA.d&&ZA.d.can_admin;
 return `<div class="zs-ov" onclick="if(event.target===this)zsClose()"><div class="zs"><div class="zs-h"><b>Cài đặt</b><button onclick="zsClose()" title="Đóng">${ic('x')}</button></div>
  <div class="zs-b"><div class="zs-menu">${ZS_MENU.map(m=>m[0]==='g'?`<div class="zs-g">${m[1]}</div>`:`<button class="${ZS.sec===m[0]?'on':''}" onclick="ZS.sec='${m[0]}';ZA.testRes=null;render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${m[2]}</svg>${m[1]}</button>`).join('')}</div>
  <div class="zs-c"><div class="zs-ci">${zsBody()}</div>${ai&&adm?`<div class="zs-f"><span class="mini">${ZA.dirty?'● Có thay đổi chưa lưu':'Đã lưu'}</span><button class="btn" onclick="ZA.d=null;ZA.dirty=false;render()">Huỷ thay đổi</button><button class="btn primary" id="za-save" onclick="zaSave()">${ic('check')} Lưu</button></div>`:''}</div></div></div></div>`}
function zfold(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d')}
async function zuAiPerson(uid,name,on){try{const d=await apiPost('/api/zalo_user.php',{action:'ai_person',uid,name,on});if(IB.info&&IB.info.zu_ai)IB.info.zu_ai.allowed=d.allowed;ZA.d=null;toast(on?'AI sẽ trả lời người này':'AI không trả lời người này');render()}catch(e){toast('Lỗi',e.message)}}
function pgInbox(){
 if(CHAT_APP)return pgChatApp();
 if(!IB.loaded){ibLoad();return `<div class="menuhead"><h1>Cửa sổ chat</h1></div><div class="empty">Đang tải…</div>`}
 if(!IB.timer){IB.timer=setInterval(ibTick,4000);ibTick()}
 const c=IB.counts||{},f=IB.f,prs=IB.projects||[];
 const src=IB.sources||[];const bad=src.filter(x=>x.sync&&x.sync.ok===false);

 const chv=(f.provider||'')+':'+(f.kind||'');const chOn=v=>v===''?!f.provider:v===chv||(v.endsWith(':')&&v===f.provider+':'&&!f.kind);

 return `<div class="ib-page"><div class="ib-pagehead"><div><h1>Cửa sổ chat</h1><div class="sub">${num(c.open||0)} cần trả lời · ${num(c.unread||0)} chưa đọc · ${src.length} kênh${bad.length?` · <span style="color:var(--bad)">${bad.length} kênh lỗi</span>`:''}</div></div><div class="ib-srcs">${srcHtml}<button class="btn sm" onclick="ibSync()">${ic('trend')} Kéo tin</button></div></div>
 ${IB.err?`<div class="ib-alert bad">${esc(IB.err)}</div>`:''}
 ${IB.appLive===false?`<details class="ib-alert"><summary><b>⚠ App Facebook đang ở chế độ phát triển</b> — tin trả lời từ Hub khách Facebook chưa thấy. <u>Chi tiết</u></summary><div style="margin-top:6px">Theo quy định Meta, tin nhắn và bình luận gửi từ Hub chỉ quản trị app thấy. Tạm thời trả lời khách Facebook trong Business Suite / app Facebook; Hub vẫn gom tin, AI chỉ gợi ý. Hết hạn chế khi app chuyển Live (sau xác minh doanh nghiệp). <b>Zalo cá nhân không bị ảnh hưởng.</b></div></details>`:''}
 ${!src.length?`<div class="ib-alert">Chưa có kênh nhận tin nhắn. Vào Cài đặt dự án → Tài khoản kết nối → đăng nhập Zalo cá nhân, thêm Fanpage hoặc Zalo OA.</div>`:''}

async function ldUploadHero(inp){
 const f=inp&&inp.files&&inp.files[0];if(!f)return;
 if(f.size>5*1024*1024){toast('Ảnh quá 5 MB');return}
 toast('Đang tải ảnh lên…');
 try{
  const fd=new FormData();fd.append('file',f);
  const r=await fetch('/api/upload.php',{method:'POST',credentials:'same-origin',headers:PH(),body:fd});

  idea_id:i.id,
  from:'Ý tưởng: '+i.title,
  title:i.title,
  cta:i.cta||'Đăng ký tư vấn',
  channel:i.channel||'website',
  campaign_id:i.campaign_id||'',
  prompt:`Tạo trang đích cho chiến dịch "${i.title}". Thông điệp chủ đạo: ${i.message||''}. Đối tượng: ${i.audience||''}. Insight khách hàng: ${i.insight||''}. Kêu gọi hành động: ${i.cta||'Đăng ký tư vấn'}.`
 };
 UT.editId=null;UT.lmode='prompt';
 setTab('utilities','landing');
 toast('Đã chuyển thông tin sang công cụ Tạo Landing Page');
}

async function ideaArchive(id,st){try{await apiPost('/api/ideas.php',{id,state:st});toast(st==='archived'?'Đã đưa vào lưu trữ':'Đã khôi phục ý tưởng');UT.ideas=null;render()}catch(e){toast('Lỗi',e.message)}}
async function ideaConvert(id){try{const d=await apiPost('/api/ideas.php',{action:'campaign_draft',id});toast(d.created?'Đã tạo chiến dịch nháp':'Ý tưởng này đã có chiến dịch',d.campaign_id);UT.ideas=null;await refreshData()}catch(e){toast('Lỗi',e.message)}}
async function ideaTask(id){const i=(UT.ideas||[]).find(x=>x.id===id);if(!i)return;try{await apiPost('/api/tasks.php',{title:'Triển khai ý tưởng: '+i.title,board:'research',col:'REQUEST',type:'research',pri:'P2'});toast('Đã tạo công việc');await refreshData()}catch(e){toast('Lỗi',e.message)}}
async function ideaDelete(id){if(!confirm('Xoá ý tưởng này?'))return;try{await apiDelete('/api/ideas.php?id='+encodeURIComponent(id));UT.ideas=null;render()}catch(e){toast('Lỗi',e.message)}}

/* ================= CÀI ĐẶT DỰ ÁN ================= */
function pgSettingsMenu(){
 const t=tabOf('setmenu','project');
 const tabs=[['project','Thông tin dự án','flag'],['members','Thành viên & quyền','users'],['integ','Tài khoản kết nối','link',(DB.connections||[]).length]].concat(isManager()?[['staff','Nhân sự & hiệu suất','users']]:[]).concat(isAdmin()?[['system','Hệ thống (AI, dữ liệu, gửi tin)','settings']]:[]).concat([['account','Tài khoản của tôi','users']]);
 let body='';const p=proj()||{};
 if(t==='project'){
  body=`<div class="card" style="max-width:720px"><div class="card-h"><h3>Thông tin dự án</h3><span class="sub">Mã: ${esc(p.id||'')}</span></div><div class="card-b">
   <div class="grid2"><div class="field"><label>Tên dự án</label><input id="ps-name" value="${esc(p.name||'')}"${projAdmin()?'':' disabled'}></div><div class="field"><label>Loại</label><select id="ps-type"${projAdmin()?'':' disabled'}><option value="internal"${p.type==='internal'?' selected':''}>Dự án nội bộ</option><option value="client"${p.type==='client'?' selected':''}>Dự án khách hàng</option></select></div></div>
   <div class="grid2"><div class="field"><label>Website</label><input id="ps-domain" value="${esc(p.domain||'')}"${projAdmin()?'':' disabled'}></div><div class="field"><label>Múi giờ</label><input id="ps-tz" value="${esc(p.timezone||'Asia/Ho_Chi_Minh')}"${projAdmin()?'':' disabled'}></div></div>
   <div class="field"><label>Mục tiêu marketing</label><textarea id="ps-goal" rows="2"${projAdmin()?'':' disabled'}>${esc(p.goal||'')}</textarea></div>
   <div class="grid2"><div class="field"><label>Ngân sách KẾ HOẠCH / tháng (₫)</label><input id="ps-budget" type="number" min="0" value="${p.budget_month||0}"${projAdmin()?'':' disabled'}><div class="mini">Không phải ngân sách đã gửi nền tảng quảng cáo.</div></div><div class="field"><label>Màu nhận diện</label><input id="ps-color" type="color" value="${esc(p.color||'#2563eb')}"${projAdmin()?'':' disabled'}></div></div>
   <div class="grid2"><div class="field"><label>Nguồn CRM (dữ liệu thật)</label><select id="ps-crm"${projAdmin()?'':' disabled'}><option value=""${(p.settings||{}).crm?'':' selected'}>— Không —</option><option value="webseo"${(p.settings||{}).crm==='webseo'?' selected':''}>CRM webseo.vn (cùng VPS, chỉ đọc)</option></select><div class="mini">Hiện lead, khách, dịch vụ sắp hết hạn, tiền vào từ CRM ở Tổng quan và Khách hàng.</div></div><div class="field"><label>Mã dự án cho máy HL</label><input value="${esc(p.id||'')}" readonly><div class="mini">Máy HL gửi báo cáo kèm project_id này (khoá X-HL-Key đặt trên máy chủ).</div></div></div>
   <div class="field"><label>Nhóm từ khoá của dự án (Phân tích thị trường)</label><textarea id="ps-kw" rows="4" placeholder="Mỗi dòng một nhóm — Tên nhóm: từ khoá 1, từ khoá 2…&#10;VD: Mẹ & bé: mẹ bầu, sữa, bé, sau sinh"${projAdmin()?'':' disabled'}>${esc(kwGroupsText(p.settings))}</textarea><div class="mini">Từ khoá Search Console chứa từ nào thì xếp vào nhóm đó. Để trống = ${(p.settings||{}).crm==='webseo'?'nhóm dịch vụ WebSEO':'Thương hiệu / Giá-mua'}.</div></div>
   <div class="card" style="margin:6px 0 12px;background:#f8f5ff;border-color:#d8ccff"><div class="card-b"><b>AI chăm sóc trong Cửa sổ chat</b>
    <div class="grid2" style="margin-top:8px"><div class="field"><label>Chế độ</label><select id="ps-aimode"${projAdmin()?'':' disabled'}><option value="off"${((p.settings||{}).ai_care||{}).mode==='auto'||((p.settings||{}).ai_care||{}).mode==='suggest'?'':' selected'}>Tắt</option><option value="suggest"${((p.settings||{}).ai_care||{}).mode==='suggest'?' selected':''}>Chỉ gợi ý (người bấm gửi)</option><option value="auto"${((p.settings||{}).ai_care||{}).mode==='auto'?' selected':''}>Tự trả lời khách 24/7</option></select><div class="mini">Tự trả lời: AI trả lời ngay mỗi tin khách; im lặng khi người thật vừa trả lời (60 phút) hoặc hội thoại đã giao người; khách khiếu nại/hỏi ngoài dữ liệu → giữ khách + báo quản lý.</div></div>
    <div class="field"><label>Bình luận công khai dưới bài</label><select id="ps-aicm"${projAdmin()?'':' disabled'}><option value="auto"${(((p.settings||{}).ai_care||{}).comments||'auto')==='auto'?' selected':''}>AI tự trả lời bình luận (khi chế độ = Tự trả lời)</option><option value="suggest"${(((p.settings||{}).ai_care||{}).comments||'auto')==='suggest'?' selected':''}>Bình luận chỉ gợi ý, người bấm gửi</option></select><div class="mini">Tin nhắn riêng vẫn theo Chế độ ở trên.</div></div>
    <div class="field"><label>Hướng dẫn riêng cho AI</label><textarea id="ps-aiins" rows="4" placeholder="VD: Freeship đơn từ 500k. Giao 1-3 ngày. Luôn xin SĐT để tư vấn. Không bàn về đối thủ."${projAdmin()?'':' disabled'}>${esc(((p.settings||{}).ai_care||{}).instructions||'')}</textarea><div class="mini">AI còn đọc Thương hiệu & quy tắc của dự án và dữ liệu sản phẩm/giá trên website (${esc(p.domain||'chưa có website')}).</div></div></div></div></div>
   <div class="grid2"><div class="field"><label>Hotline hiển thị</label><input id="ps-hotline" value="${esc((p.settings||{}).hotline||'')}"${projAdmin()?'':' disabled'}></div><div class="field"><label>Telegram chat ID riêng (tuỳ chọn)</label><input id="ps-tg" value="${esc((p.settings||{}).telegram_chat_id||'')}"${projAdmin()?'':' disabled'}><div class="mini">Để trống = dùng nhóm Telegram chung.</div></div></div>
   ${projAdmin()?`<div class="hact"><button class="btn primary" onclick="projSave()">${ic('check')} Lưu</button>${(projRole()==='owner'||isAdmin())&&(DB.projects||[]).length>1?`<button class="btn" onclick="projArchive()">${ic('archive')} Lưu trữ dự án</button>`:''}</div>`:'<div class="mini">Chỉ chủ / quản lý dự án sửa được.</div>'}
  </div></div>`;
 } else if(t==='members'){body=projMembers()}
 else if(t==='integ'){body=connectionsSection()}
 else if(t==='staff'){body=pgStaff()}
 else if(t==='system'){if(!S.tab.settings||S.tab.settings==='integ')S.tab.settings='perm';body=pgSettings()}
 else {S.tab.settings='account';body=pgSettings()}
 return `<div class="menuhead"><h1>Cài đặt dự án</h1><div class="sub">${esc(p.name||'')}</div></div>${seg('setmenu',tabs,t)}${body}`;
}
async function projSave(){
 const b={action:'update',id:S.project,name:$('#ps-name').value.trim(),type:$('#ps-type').value,domain:$('#ps-domain').value.trim(),timezone:$('#ps-tz').value.trim(),goal:$('#ps-goal').value.trim(),budget_month:+$('#ps-budget').value||0,color:$('#ps-color').value,settings:{hotline:$('#ps-hotline').value.trim(),telegram_chat_id:$('#ps-tg').value.trim(),crm:$('#ps-crm').value,keyword_groups:kwGroupsParse($('#ps-kw').value),ai_care:{mode:$('#ps-aimode').value,comments:$('#ps-aicm').value,instructions:$('#ps-aiins').value.trim()}}};
 try{await apiPost('/api/projects.php',b);toast('Đã lưu');await loadData();renderScope();render()}catch(e){toast('Lỗi',e.message)}
}
async function projArchive(){if(!confirm('Lưu trữ dự án này? Dữ liệu giữ nguyên, dự án ẩn khỏi danh sách.'))return;try{await apiPost('/api/projects.php',{action:'archive',id:S.project});toast('Đã lưu trữ');S.project=null;resetProjectCaches();await loadData();renderScope();renderNav();go('portfolio')}catch(e){toast('Lỗi',e.message)}}
function projMembers(){
 if(!UT.members){(async()=>{try{const d=await apiGet('/api/projects.php?id='+encodeURIComponent(S.project));UT.members=d.project.members||[];UT.roles=d.roles}catch(e){UT.members=[];toast('Lỗi',e.message)}render()})();return '<div class="empty">Đang tải…</div>'}
 const roles=UT.roles||PROJECT_ROLES_LABEL;
 const all=(DB.staff||[]);const inM=new Set(UT.members.map(m=>m.user_id));
 return `<div class="card" style="max-width:860px"><div class="card-h"><h3>Thành viên dự án</h3><span class="sub">${UT.members.length} người · vai trò theo dự án, tách khỏi vai trò hệ thống</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Thành viên</th><th>Vai trò trong dự án</th><th>Từ</th><th></th></tr></thead><tbody>
  ${UT.members.map(m=>`<tr><td><b>${esc(m.name)}</b><div class="mini">${esc(m.email||'')}${m.title?' · '+esc(m.title):''}${m.active?'':' · <span class="badge b-bad">đã khoá</span>'}</div></td><td>${projAdmin()?`<select onchange="memberSet('${esc(m.user_id)}',this.value)">${Object.entries(roles).map(([k,v])=>`<option value="${k}"${m.role===k?' selected':''}>${v}</option>`).join('')}</select>`:esc(m.role_label||roles[m.role]||m.role)}</td><td class="r-mut">${esc((m.since||'').slice(0,10))}</td><td>${projAdmin()?`<button class="btn xs" onclick="memberRemove('${esc(m.user_id)}')">Gỡ</button>`:''}</td></tr>`).join('')}
 </tbody></table></div>${projAdmin()&&isManager()?`<div class="card-b"><div class="grid2"><div class="field"><label>Thêm tài khoản</label><select id="mb-user">${all.filter(u=>!inM.has(u.id)&&u.active).map(u=>`<option value="${esc(u.id)}">${esc(u.name)} (${esc(u.role||u.sysrole||'')})</option>`).join('')||'<option value="">— mọi tài khoản đã là thành viên —</option>'}</select><div class="mini">Tài khoản mới tạo ở Nhân sự & hiệu suất (quản trị). Khách hàng cũng là một tài khoản với vai trò "Khách hàng".</div></div><div class="field"><label>Vai trò</label><select id="mb-role">${Object.entries(roles).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><button class="btn primary" onclick="memberSet($('#mb-user').value,$('#mb-role').value)">${ic('plus')} Thêm vào dự án</button></div>`:''}
 <div class="card-b mini">Quyền: Chủ/Quản lý dự án — quản lý kênh, duyệt, thành viên, ngân sách. Nội dung — soạn, đề nghị duyệt. Quảng cáo — chiến dịch ads. Khách hàng — xem báo cáo, duyệt nội dung. Chỉ xem — không sửa. Backend kiểm tra ở mọi API, không chỉ ẩn nút.</div></div>`;
}
async function memberSet(uid,role){if(!uid)return;try{const d=await apiPost('/api/projects.php',{action:'member_set',id:S.project,user_id:uid,role});UT.members=d.members;toast('Đã cập nhật thành viên');await loadData();render()}catch(e){toast('Lỗi',e.message)}}
async function memberRemove(uid){if(!confirm('Gỡ thành viên khỏi dự án?'))return;try{const d=await apiPost('/api/projects.php',{action:'member_remove',id:S.project,user_id:uid});UT.members=d.members;await loadData();render()}catch(e){toast('Lỗi',e.message)}}

boot();
</script>
