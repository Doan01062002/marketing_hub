<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2533">
<title>Marketing Hub — Phòng Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#7c3aed;--brand-d:#6d28d9;--brand-t:#f1ebfd;--ink:#151c2c;--ink2:#2f3a4d;--mut:#6b7789;--mut2:#9aa5b5;--line:#e7ebf1;--line2:#eef1f6;--bg:#f4f6fa;--ok:#0d9488;--ok-t:#e2f4f1;--bad:#dc2626;--bad-t:#fbe9ee;--warn:#d97706;--warn-t:#fdf0dc;--info:#2563eb;--info-t:#e7effd;--vio:#7c3aed;--vio-t:#f1ebfd;--pink:#db2777;--disp:'Sora',sans-serif;--shadow:0 1px 2px rgba(20,28,44,.05),0 1px 3px rgba(20,28,44,.06);--shadow-lg:0 20px 50px rgba(20,28,44,.22)}
*{margin:0;padding:0;box-sizing:border-box}
svg{display:block;width:16px;height:16px;flex-shrink:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh}
/* sidebar */
.sidebar{background:#151c2c;color:#c7d0de;display:flex;flex-direction:column;overflow:hidden}
.sb-brand{display:flex;align-items:center;gap:11px;padding:17px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-brand .lg{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#9f67ff,#6d28d9);display:grid;place-items:center;flex-shrink:0}
.sb-brand .lg svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2.1}
.sb-brand b{font-family:var(--disp);font-size:16px;color:#fff;font-weight:800;letter-spacing:-.3px;display:block}
.sb-brand span{font-size:11px;color:#8b96a8}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.sb-nav::-webkit-scrollbar{width:6px}.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.sb-grp{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#697689;padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:500;color:#c7d0de;margin-bottom:1px;transition:background .12s;text-decoration:none}
.nav-i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;color:#8b96a8}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i.on{background:var(--brand);color:#fff}.nav-i.on svg{color:#fff}
.nav-i .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px;font-weight:600}
.nav-i.on .cnt{background:rgba(255,255,255,.24)}
.sb-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.sb-foot .av{width:34px;height:34px;border-radius:9px;background:#6d28d9;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.sb-foot b{font-size:12.5px;color:#fff;display:block}.sb-foot span{font-size:11px;color:#8b96a8}
/* main */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0}
.tb-title{font-weight:700;font-size:15px;white-space:nowrap}
.scope{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px 4px}
.scope svg{width:15px;height:15px;color:var(--brand);margin-left:5px}
.scope select{border:none;background:none;outline:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;height:30px;max-width:170px}
.scope .sep{color:var(--mut2);font-size:12px}
.tb-search{flex:1;max-width:320px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 12px;height:38px}
.tb-search svg{width:16px;height:16px;color:var(--mut)}
.tb-search input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;flex:1}
.tb-sp{flex:1}
.tb-ic{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--mut);cursor:pointer;position:relative}
.tb-ic:hover{border-color:var(--brand);color:var(--brand)}
.tb-ic .nd{position:absolute;top:-4px;right:-4px;background:var(--pink);color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:10px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.content{flex:1;width:100%;overflow-y:auto;padding:22px 26px 60px}
/* pagehead */
.pagehead{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h1{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.5px}
.pagehead .sub{font-size:13px;color:var(--mut);margin-top:2px}
.pagehead .ph-act{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .12s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px}
.btn.danger{color:var(--bad);border-color:#f3c9d3}.btn.danger:hover{background:var(--bad);border-color:var(--bad);color:#fff}
/* kpi */
.kpis{display:grid;gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow);position:relative}
.kpi .lbl{font-size:12px;color:var(--mut);font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .lbl .ki{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.kpi .lbl .ki svg{width:15px;height:15px}
.kpi .val{font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:9px;line-height:1.1}
.kpi .dl{font-size:11.5px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .dl.up{color:var(--ok)}.kpi .dl.down{color:var(--bad)}.kpi .dl.flat{color:var(--mut)}
.kpi .dl span{color:var(--mut2);font-weight:500}
/* card */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.card-h svg{width:17px;height:17px;color:var(--brand)}
.card-h h3{font-size:14.5px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--mut);font-weight:500}
.card-h .hact{margin-left:auto;display:flex;gap:8px}
.card-b{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* filter bar */
.filterbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--shadow)}
.fb-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 11px;height:36px;flex:1;min-width:180px;max-width:300px}
.fb-search svg{width:15px;height:15px;color:var(--mut)}
.fb-search input{border:none;background:none;outline:none;font-family:inherit;font-size:13px;flex:1}
.filterbar select,.filterbar input[type=date]{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.filterbar select:focus,.filterbar input:focus{outline:none;border-color:var(--brand)}
.fb-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* table */
.tbl-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff;box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{text-align:left;padding:11px 14px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr.clk{cursor:pointer}.tbl tbody tr.clk:hover{background:#faf8ff}
.tbl tfoot td{padding:11px 14px;font-weight:800;background:#fafbfc;border-top:2px solid var(--line)}
.tar{text-align:right}.tac{text-align:center}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.r-strong{font-weight:600;color:var(--ink)}.r-mut{color:var(--mut);font-size:12px}
.neg{color:var(--bad);font-weight:600}.pos{color:var(--ok);font-weight:600}
.cellmain{display:flex;align-items:center;gap:10px}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2);cursor:pointer}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}.iconbtn svg{width:15px;height:15px}
/* avatar / chips / badges */
.av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.av.sm{width:28px;height:28px;font-size:11px}
.av svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:7px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-t);color:var(--ok)}.b-warn{background:var(--warn-t);color:var(--warn)}.b-bad{background:var(--bad-t);color:var(--bad)}
.b-info{background:var(--info-t);color:var(--info)}.b-vio{background:var(--vio-t);color:var(--vio)}.b-mut{background:#eef1f5;color:var(--mut)}
.tag{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--brand-t);color:var(--brand-d)}
.tag.lock{background:var(--bad-t);color:var(--bad)}.tag.ovr{background:var(--warn-t);color:var(--warn)}.tag.inh{background:var(--info-t);color:var(--info)}.tag.loc{background:var(--ok-t);color:var(--ok)}
/* subject pill */
.subj{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:#eef0ff;color:#4338ca}
.subj svg{width:12px;height:12px}
.refbadge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:#eef1f5;color:var(--mut)}
.refbadge svg{width:11px;height:11px}
.mini{font-size:12px;color:var(--mut)}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:16px 0 9px}.sec-lbl:first-child{margin-top:0}
.empty{text-align:center;padding:52px 20px;color:var(--mut)}
.empty .ei{width:58px;height:58px;border-radius:15px;background:var(--bg);display:grid;place-items:center;margin:0 auto 13px}.empty .ei svg{width:27px;height:27px;color:var(--mut2)}
.empty h4{font-size:16px;color:var(--ink);margin-bottom:6px}
/* progress */
.prog{height:8px;background:#eef1f5;border-radius:5px;overflow:hidden}.prog>div{height:100%;border-radius:5px;background:linear-gradient(90deg,#9f67ff,#6d28d9)}
/* layer / modal / drawer / toast */
#layer{position:fixed;inset:0;z-index:80;pointer-events:none}
.ov{position:absolute;inset:0;background:rgba(20,28,44,.44);opacity:0;transition:opacity .2s;pointer-events:auto}.ov.show{opacity:1}
.modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%);width:660px;max-width:94vw;max-height:92vh;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);opacity:0;transition:all .2s;pointer-events:auto;display:flex;flex-direction:column;overflow:hidden}
.modal.show{transform:translate(-50%,-50%);opacity:1}.modal.lg{width:880px}
.mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mh h3{font-size:16px;flex:1}.mh svg{width:18px;height:18px;color:var(--brand)}
.mh .x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.mb{padding:18px 20px;overflow-y:auto}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fafbfc}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:38px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-family:inherit;font-size:13.5px}
.field input,.field select{height:38px}.field textarea{resize:vertical;min-height:64px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frow.f3{grid-template-columns:1fr 1fr 1fr}
.drawer{position:absolute;top:0;right:0;height:100%;width:600px;max-width:96vw;background:#fff;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s;pointer-events:auto;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.dh .d-title{font-size:16px;font-weight:700}.dh .d-sub{font-size:12.5px;color:var(--mut)}
.dh .x{margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.db{padding:18px 20px;overflow-y:auto;flex:1}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{background:#151c2c;color:#fff;border-radius:12px;padding:11px 16px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:11px;min-width:220px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.toast .tic{width:28px;height:28px;border-radius:8px;background:var(--ok);display:grid;place-items:center;flex-shrink:0}.toast .tic svg{width:15px;height:15px;stroke:#fff}
.toast b{font-size:13px;display:block}.toast span{font-size:11.5px;color:#aeb8c7}
/* segmented pill tabs */
.segbar{display:flex;gap:4px;background:#f1f3f7;border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px;flex-wrap:wrap;width:fit-content;max-width:100%}
.seg{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;border:0;background:none;font-family:inherit}
.seg svg{width:15px;height:15px}
.seg.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.seg .cnt{font-size:11px;background:#e4e8ef;color:var(--mut);padding:0 6px;border-radius:20px;font-weight:700}.seg.on .cnt{background:var(--brand-t);color:var(--brand-d)}
/* quick filter chips */
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;background:#fff;border:1px solid var(--line)}
.fchip:hover{border-color:var(--brand);color:var(--brand-d)}
.fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fchip .n{font-size:11px;background:rgba(0,0,0,.08);padding:0 7px;border-radius:20px;font-weight:700}.fchip.on .n{background:rgba(255,255,255,.25)}
/* doc list */
.doclist{display:flex;flex-direction:column;gap:10px}
.docrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s}
.docrow:hover{border-color:var(--brand)}
.docrow .dic{width:40px;height:40px;border-radius:10px;background:var(--brand-t);color:var(--brand-d);display:grid;place-items:center;flex-shrink:0}
.docrow .dm{flex:1;min-width:0}
.docrow .dm .t1{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.docrow .dm .t2{font-size:12px;color:var(--mut);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.docrow .dr{text-align:right;flex-shrink:0}
.docrow .dr .a{font-weight:800;font-family:var(--disp);font-size:15px}
.docrow .dr .a2{font-size:11.5px;color:var(--mut);margin-top:2px}
/* top-list */
.toplist{display:flex;flex-direction:column}
.topitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}.topitem:last-child{border-bottom:none}
.topitem .tn{flex:1;min-width:0}.topitem .tn b{font-size:13.5px;font-weight:700}.topitem .tn span{font-size:12px;color:var(--mut);display:block;margin-top:2px}
.topitem .tv{font-weight:800;font-family:var(--disp)}
/* charts */
.repchart{width:100%}.repchart svg{width:100%!important;height:auto!important}
.repdonut svg{width:170px!important;height:170px!important}
.donutwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.dleg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;width:100%;color:var(--ink2)}.dleg b{margin-left:auto;font-family:monospace}
.ds{width:11px;height:11px;border-radius:3px;flex-shrink:0}
/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px}
.fnrow{display:flex;align-items:center;gap:12px}
.fnbar{height:38px;border-radius:9px;background:linear-gradient(90deg,#9f67ff,#6d28d9);display:flex;align-items:center;padding:0 13px;color:#fff;font-weight:700;font-size:13px;min-width:80px;transition:width .3s}
.fnrow .fl{width:150px;flex-shrink:0;font-size:12.5px;color:var(--ink2);font-weight:600}
.fnrow .fc{font-size:12px;color:var(--mut);margin-left:8px;white-space:nowrap}
/* kanban */
.kanban{display:flex;gap:13px;overflow-x:auto;padding-bottom:8px}
.kcol{flex:0 0 268px;background:#f1f3f7;border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;max-height:640px}
.kcol-h{padding:11px 13px;font-size:12px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.kcol-h .kn{margin-left:auto;font-size:11px;background:#e4e8ef;color:var(--mut);padding:0 7px;border-radius:20px;font-weight:700}
.kcol-h .kdot{width:8px;height:8px;border-radius:50%}
.kcol-b{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s}
.kcard:hover{border-color:var(--brand)}
.kcard .kt{font-size:12.5px;font-weight:700;margin-bottom:6px;line-height:1.35}
.kcard .km{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.kcard .kf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)}
.kcard .kf .due{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:4px}.kcard .kf .due svg{width:12px;height:12px}
.kcard .kf .due.late{color:var(--bad);font-weight:700}
.stat3{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px}

const CHAT_APP=new URLSearchParams(location.search).has('chat');
if(CHAT_APP)document.documentElement.classList.add('chatapp');else if(/^#inbox/.test(location.hash))location.replace(location.pathname+'?chat=1'+location.hash);
const APP_BASE=location.pathname.endsWith('/')?location.pathname:location.pathname.replace(/[^/]*$/,'');
function API(u){return (typeof u==='string'&&u.startsWith('/api/'))?APP_BASE+u.slice(1):u}
(function(){const _f=window.fetch.bind(window);window.fetch=(u,o)=>_f(API(u),o)})();
const $=(s,r=document)=>r.querySelector(s);

let CURRENT_USER=null;
let ROLES={admin:'Quản trị',manager:'Trưởng nhóm',staff:'Nhân viên'},CAN_APPROVE=false;
function isAdmin(){return !!CURRENT_USER&&CURRENT_USER.role==='admin'}
function isManager(){return !!CURRENT_USER&&(CURRENT_USER.role==='admin'||CURRENT_USER.role==='manager')}
async function apiGet(url){
 const r=await fetch(url,{credentials:'same-origin',headers:PH()});
 if(r.status===401){renderLogin();throw new Error('unauth')}
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||('Lỗi máy chủ ('+r.status+')'));
 return d;
}
async function apiPost(url,body){
 const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:PH({'Content-Type':'application/json'}),body:JSON.stringify(body||{})});
 const d=await r.json().catch(()=>({}));
 if(r.status===401){renderLogin();throw new Error('unauth')}
 if(!r.ok)throw new Error(d.error||('Lỗi máy chủ ('+r.status+')'));
 return d;
}
async function apiDelete(url){
 const r=await fetch(url,{method:'DELETE',credentials:'same-origin',headers:PH()});
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||('Lỗi máy chủ ('+r.status+')'));
 return d;
}

   <div id="li-err" style="color:var(--bad);font-size:12.5px;margin:-4px 0 12px;min-height:16px">${err?err:''}</div>

}
async function doLogin(){
 const email=$('#li-email').value.trim(),pass=$('#li-pass').value;
 const errEl=$('#li-err');
 if(!email||!pass){errEl.textContent='Nhập đầy đủ email và mật khẩu';return}
 try{await apiPost('/api/auth.php?action=login',{email,password:pass});location.reload()}
 catch(e){errEl.textContent=e.message||'Đăng nhập thất bại'}
}
function notifyOauthResult(){
 const p=new URLSearchParams(location.search);
 if(p.get('conn_ok')){
  const c=(DB.connections||[]).find(x=>x.id===p.get('conn_ok'));
  if(c&&c.provider==='tiktok'){S.ch=S.ch||{};S.ch.channels='tt';S.tab.chsub='api';if(S.page==='channels')render()}
  toast('Đã kết nối',c?c.label:'');
  if(c&&!c.external_account_id){
   if(c.provider==='facebook_page')autoImportAll(c).then(r=>{if(r==='err')pickAccounts(c.id)});
   else setTimeout(()=>pickAccounts(c.id),300);
  }
 }
 if(p.get('conn_msg')){toast('TikTok',p.get('conn_msg'));}
 if(p.get('conn_error')){toast('Kết nối lỗi',p.get('conn_error'));}
 if(p.get('conn_ok')||p.get('conn_error')){history.replaceState({},'',location.pathname+location.hash)}
}
async function boot(){
 try{
  const me=await fetch('/api/auth.php?action=me',{credentials:'same-origin'}).then(r=>r.json());
  if(!me.user){renderLogin();return}
  await loadData();
  const h=location.hash.split('?')[0].slice(1).split('/');const initial=h[0];
  if(initial&&TITLES[initial]){S.page=LEGACY[initial]?LEGACY[initial][0]:initial;const tk0=MENU_TAB[S.page]||S.page;if(LEGACY[initial]&&LEGACY[initial][1])S.tab[tk0]=LEGACY[initial][1];if(h[1])S.tab[tk0]=h[1]}
  if(!DB.project)S.page='portfolio';
  if(CHAT_APP){S.page='inbox';document.title='Chat · Marketing Hub'}
  renderSbFoot();renderScope();renderNav();
  $('#tbtitle').textContent=TITLES[S.page]||'';
  render();
  notifyOauthResult();
  if(typeof startNotifPolling==='function')startNotifPolling();
 }catch(e){ if(e.message!=='unauth') renderLogin(e.message) }
}

function M(n){return Math.round(n||0).toLocaleString('vi-VN')}
function num(n){return (n||0).toLocaleString('vi-VN')}
function initials(n){return n.split(' ').filter(Boolean).slice(-2).map(w=>w[0]).join('').toUpperCase()}
function avc(s){const c=['#7c3aed','#2563eb','#0d9488','#db2777','#d97706','#0891b2','#e8750a'];let h=0;for(const ch of s)h=ch.charCodeAt(0)+((h<<5)-h);return c[Math.abs(h)%c.length]}

function chLine(labels,series){const W=720,H=230,P={l:46,r:14,t:16,b:26};const vals=series.flatMap(s=>s.values);const nice=Math.max(4,Math.ceil(Math.max(...vals,1)/4)*4);const X=i=>P.l+(W-P.l-P.r)*(labels.length>1?i/(labels.length-1):.5);const Y=v=>P.t+(H-P.t-P.b)*(1-v/nice);let g='';for(let i=0;i<=4;i++){const val=nice/4*i,y=Y(val);g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#eef1f5"/><text x="${P.l-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a0b0">${Math.round(val).toLocaleString('vi-VN')}</text>`}let xl=labels.map((l,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#94a0b0">${l}</text>`).join('');let paths='';series.forEach((sr,si)=>{const pts=sr.values.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');if(si===0)paths+=`<polygon points="${P.l},${Y(0)} ${pts} ${W-P.r},${Y(0)}" fill="${sr.color}" opacity=".09"/>`;paths+=`<polyline points="${pts}" fill="none" stroke="${sr.color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;paths+=sr.values.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.1" fill="#fff" stroke="${sr.color}" stroke-width="2"/>`).join('')});const leg=series.map(s=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#4b5563;margin-right:14px"><span style="width:11px;height:11px;border-radius:3px;background:${s.color}"></span>${s.name}</span>`).join('');return `<div style="margin-bottom:8px">${leg}</div><div class="repchart"><svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${g}${paths}${xl}</svg></div>`}
function chDonut(segs){const tot=segs.reduce((s,x)=>s+x.value,0)||1;const C=2*Math.PI*54;let off=0;let circ=segs.map(s=>{const len=s.value/tot*C;const el=`<circle cx="90" cy="90" r="54" fill="none" stroke="${s.color}" stroke-width="24" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"/>`;off+=len;return el}).join('');const legend=segs.map(s=>`<div class="dleg"><span class="ds" style="background:${s.color}"></span>${s.label}<b>${s.fmt?s.fmt(s.value):M(s.value)}</b></div>`).join('');return `<div class="donutwrap"><div class="repdonut"><svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">${circ}</svg></div><div style="width:100%">${legend}</div></div>`}
function chSpark(vals,color){const W=140,H=38;const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;const X=i=>(W)*(i/(vals.length-1));const Y=v=>4+(H-8)*(1-(v-mn)/rg);const pts=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function funnel(rows){const mx=rows[0].v||1;return `<div class="funnel">${rows.map(r=>`<div class="fnrow"><div class="fl">${r.l}</div><div class="fnbar" style="width:${Math.max(12,r.v/mx*100)}%;background:${r.c||'linear-gradient(90deg,#9f67ff,#6d28d9)'}">${num(r.v)}</div><div class="fc">${r.p||''}</div></div>`).join('')}</div>`}

function realFunnel(){
 const s=(p,k)=>connsOf(p).reduce((t,c)=>t+(cmetric(c,k)||0),0),has=(p,k)=>connsOf(p).some(c=>cmetric(c,k)!=null);
 const reachParts=[['Fanpage',has('facebook_page','reach'),s('facebook_page','reach')],['YouTube',has('youtube','views'),s('youtube','views')],['TikTok',has('tiktok','views'),s('tiktok','views')],['Google Search',has('gsc','impressions'),s('gsc','impressions')],['Google Maps',has('gbp','views'),s('gbp','views')],['Quảng cáo',has('meta_ads','reach')||has('google_ads','impressions'),s('meta_ads','reach')+s('google_ads','impressions')]].filter(x=>x[1]);
 const visitParts=[['Website (GA4)',has('ga4','sessions'),s('ga4','sessions')],['Click Google Search',has('gsc','clicks')&&!has('ga4','sessions'),s('gsc','clicks')],['Click quảng cáo',has('meta_ads','clicks')||has('google_ads','clicks'),s('meta_ads','clicks')+s('google_ads','clicks')],['Gọi/chỉ đường (Maps)',has('gbp','calls'),s('gbp','calls')+s('gbp','directions')+s('gbp','website_clicks')]].filter(x=>x[1]);
 const since=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
 const ls=DB.leads.filter(l=>inScope(l)&&(!l.created||l.created.slice(0,10)>=since));
 const steps=[];
 if(reachParts.length)steps.push({l:'Tiếp cận / hiển thị',v:reachParts.reduce((t,x)=>t+x[2],0),src:reachParts.map(x=>x[0]).join(' + ')});
 if(visitParts.length)steps.push({l:'Truy cập / tương tác',v:visitParts.reduce((t,x)=>t+x[2],0),src:visitParts.map(x=>x[0]).join(' + ')});
 steps.push({l:'Đầu mối (lead)',v:ls.length,src:'Đầu mối ghi nhận 30 ngày'});
 steps.push({l:'Đủ điều kiện',v:ls.filter(l=>['ROUTED','DELIVERED','ACCEPTED'].includes(l.state)).length,src:'Đã định tuyến / bàn giao'});
 steps.push({l:'CRM nhận',v:ls.filter(l=>l.state==='ACCEPTED').length,src:'Trạng thái ACCEPTED'});
 return steps;
}

}
function smartFindings(){
 const F=[],today=todayStr(),st=statsGet(30),hist={};
 if(st&&st.channels)st.channels.connections.forEach(h=>hist[h.id]=h);
 const add=(sev,area,title,ev,act,go)=>F.push({sev,area,title,ev,act,go});
 // 1. Nhịp chi ngân sách chiến dịch đang chạy (đã chi % so với % thời gian đã trôi qua).
 DB.campaigns.filter(c=>inScope(c)&&c.state==='ACTIVE'&&c.budget>0&&c.start&&c.end).forEach(c=>{
  const tot=daysBetween(c.start,c.end),el=Math.min(Math.max(daysBetween(c.start,today),0),tot);if(tot<=0)return;
  const tp=el/tot*100,sp=c.spent/c.budget*100;
  if(sp>tp+15)add('bad','Ngân sách',`"${c.name}" chi nhanh hơn kế hoạch`,`Đã chi ${sp.toFixed(0)}% ngân sách nhưng mới qua ${tp.toFixed(0)}% thời gian (${M(c.spent)}₫ / ${M(c.budget)}₫).`,'Giảm ngân sách ngày hoặc dời ngày kết thúc để không hết tiền sớm.','campaigns');
  else if(tp>20&&sp<tp-25)add('warn','Ngân sách',`"${c.name}" chi chậm hơn kế hoạch`,`Mới chi ${sp.toFixed(0)}% ngân sách khi đã qua ${tp.toFixed(0)}% thời gian.${c.spent===0?' Số đã chi đang là 0 — nếu chiến dịch chạy thật, cập nhật số chi từ tài khoản quảng cáo.':''}`,'Kiểm tra quảng cáo có bị giới hạn / chưa duyệt, hoặc cập nhật số đã chi.','campaigns');
  if(c.spent>0&&c.leads===0&&el>=7)add('bad','Hiệu quả',`"${c.name}" tiêu tiền nhưng chưa có lead`,`Đã chi ${M(c.spent)}₫ sau ${el} ngày, 0 lead ghi nhận.`,'Kiểm tra form/tracking chuyển đổi, đối tượng và thông điệp quảng cáo.','campaigns');
 });
 // 2. CPL lệch so với trung vị các chiến dịch.
 const cpl=DB.campaigns.filter(c=>inScope(c)&&c.leads>0&&c.spent>0).map(c=>({c,v:c.spent/c.leads}));
 const md=median(cpl.map(x=>x.v));
 if(cpl.length>=3)cpl.filter(x=>x.v>md*1.5).forEach(x=>add('warn','Hiệu quả',`CPL của "${x.c.name}" cao`,`CPL ${M(x.v)}₫ = ${(x.v/md).toFixed(1)}× trung vị ${cpl.length} chiến dịch (${M(md)}₫).`,'Chuyển ngân sách sang chiến dịch CPL thấp hoặc tối ưu nhóm quảng cáo.','campaigns'));
 // 3. Quảng cáo từ tài khoản thật.
 [...connsOf('meta_ads'),...connsOf('google_ads')].forEach(c=>{const sp=cmetric(c,'spend'),clk=cmetric(c,'clicks'),imp=cmetric(c,'impressions'),ld=cmetric(c,'leads')??cmetric(c,'conversions');
  if(sp>0&&imp>1000&&clk!=null){const ctr=clk/imp*100;if(ctr<0.8)add('warn','Quảng cáo',`CTR quảng cáo "${c.label}" thấp`,`CTR ${ctr.toFixed(2)}% (${num(clk)} click / ${num(imp)} hiển thị, 30 ngày); mốc tham khảo phổ biến ≥1%.`,'Làm mới mẫu quảng cáo / tiêu đề, thu hẹp đối tượng.','channels')}
  if(sp>0&&ld===0)add('bad','Quảng cáo',`"${c.label}" chi ${M(sp)}₫ nhưng 0 chuyển đổi`,'30 ngày gần nhất, theo số liệu tài khoản quảng cáo.','Kiểm tra sự kiện chuyển đổi (Pixel / thẻ Google Ads) đã ghi nhận chưa.','channels')});
 // 4. Xu hướng kênh (lịch sử đồng bộ hằng ngày).
 (DB.connections||[]).forEach(c=>{const h=hist[c.id];if(!h||h.days<7||h.change_pct==null)return;
  if(h.change_pct<=-10)add('warn','Kênh',`${c.label}: ${h.key_label||'chỉ số chính'} giảm ${Math.abs(h.change_pct)}%`,`Từ ${num(h.first)} xuống ${num(h.last)} trong ${h.days} ngày có số liệu.`,'Xem lại tần suất đăng / nội dung gần đây của kênh.','channels');
  else if(h.change_pct>=10)add('ok','Kênh',`${c.label}: ${h.key_label||'chỉ số chính'} tăng ${h.change_pct}%`,`Từ ${num(h.first)} lên ${num(h.last)} trong ${h.days} ngày.`,'Tìm nội dung/chiến dịch tạo tăng trưởng để nhân rộng.','channels')});
 // 5. SEO: từ khoá có nhiều hiển thị nhưng ở trang 1 dưới top 3 / trang 2 với CTR thấp = cơ hội nhanh nhất.
 connsOf('gsc').forEach(c=>{const q=((c.metrics.top||[]).find(t=>/Từ khoá/.test(t.label))||{}).rows||[];
  const ctr=cmetric(c,'ctr'),pos=cmetric(c,'position'),imp=cmetric(c,'impressions');
  if(imp>=100&&ctr!=null&&ctr<1)add('warn','SEO',`${c.label}: CTR Google Search chỉ ${ctr}%`,`${num(imp)} lượt hiển thị, vị trí TB ${pos} (28 ngày, Search Console).`,'Viết lại thẻ tiêu đề & mô tả của các trang top cho hấp dẫn hơn; vị trí >10 thì cần thêm nội dung / liên kết.','channels');
  const opp=q.filter(r=>r[4]>=4&&r[4]<=20).sort((a,b)=>b[2]-a[2]).slice(0,5);
  if(opp.length)add('info','SEO',`${c.label}: ${opp.length} từ khoá gần top`,'Vị trí 4–20 đang có hiển thị: '+opp.map(r=>`"${r[0]}" (vị trí ${r[4]}, ${num(r[2])} hiển thị)`).join('; ')+'.','Ưu tiên tối ưu nội dung + liên kết nội bộ cho các trang xếp hạng những từ này — đẩy lên top 3 thường tăng click nhiều nhất.','channels')});
 // 6. Website GA4.
 connsOf('ga4').forEach(c=>{const ses=cmetric(c,'sessions'),er=cmetric(c,'engagement_rate'),cv=cmetric(c,'conversions');
  if(ses>=100&&cv===0)add('warn','Website',`${c.label}: ${num(ses)} phiên nhưng 0 sự kiện chính`,'GA4 chưa ghi nhận chuyển đổi nào trong 30 ngày.','Đánh dấu sự kiện chính (gửi form, bấm gọi, Zalo) trong GA4 / GTM để đo được hiệu quả.','channels');
  if(ses>=100&&er!=null&&er<40)add('warn','Website',`${c.label}: tỉ lệ tương tác ${er}%`,`${num(ses)} phiên 30 ngày; dưới 40% thường là trang chậm hoặc nội dung không khớp nhu cầu.`,'Kiểm tra tốc độ trang & trang đích của nguồn truy cập lớn nhất.','channels')});
 // 7. Google Maps.
 connsOf('gbp').forEach(c=>{const r=cmetric(c,'rating');if(r!=null&&r<4.3)add('warn','Google Maps',`${c.label}: điểm đánh giá ${r}`,`${num(cmetric(c,'reviews')||0)} đánh giá.`,'Trả lời mọi đánh giá (trang Bình luận) và mời khách hài lòng đánh giá.','care')});
 // 8. Tốc độ xử lý đầu mối.
 const stale=DB.leads.filter(l=>inScope(l)&&['CREATED','VALIDATING'].includes(l.state)&&l.created&&(Date.now()-new Date(l.created.replace(' ','T')+'Z'))>86400000);
 if(stale.length)add('bad','Đầu mối',`${stale.length} đầu mối chờ quá 24 giờ`,'Trạng thái CREATED/VALIDATING tạo trước 24 giờ: '+stale.slice(0,5).map(l=>l.name).join(', ')+(stale.length>5?'…':''),'Liên hệ trong ngày — tỉ lệ chốt giảm mạnh khi phản hồi chậm.','demand');
 // 9. Việc trễ hạn.
 const late=DB.tasks.filter(t=>inScope(t)&&dueLate(t.due)&&t.col!==((BOARDS[t.board]||{cols:[[]]}).cols.slice(-1)[0]||[])[0]);
 if(late.length)add('warn','Vận hành',`${late.length} công việc trễ hạn`,late.slice(0,4).map(t=>t.title).join('; '),'Giao lại hoặc dời hạn có lý do.','tasks');
 // 10. Độ phủ đo lường.
 const missing=[['ga4','Google Analytics (website)'],['gsc','Search Console (SEO)'],['meta_ads','Quảng cáo Meta'],['google_ads','Google Ads']].filter(([p])=>!connsOf(p).length).map(x=>x[1]);
 if(missing.length)add('info','Dữ liệu',`Chưa đo được: ${missing.join(', ')}`,'Các phân tích liên quan sẽ thiếu cho tới khi kết nối.','Kết nối ở Thiết lập → Kết nối kênh (website: dùng ô Kết nối nhanh).','settings');
 const errs=(DB.connections||[]).filter(c=>c.last_error||c.status==='error');
 if(errs.length)add('bad','Dữ liệu',`${errs.length} kênh lỗi đồng bộ`,errs.map(c=>c.label+': '+(c.last_error||c.status)).join(' · ').slice(0,300),'Mở Kết nối kênh để sửa token / quyền.','settings');
 const ord={bad:0,warn:1,info:2,ok:3};return F.sort((a,b)=>ord[a.sev]-ord[b.sev]);
}

 return `<div class="card"><div class="card-h">${ic('zap')}<h3>Phân tích tự động</h3><span class="sub">${F.length?F.length+' phát hiện từ số liệu thật':'chưa có phát hiện'}</span><div class="hact">${limit&&F.length>limit?`<button class="btn sm" onclick="S.tab.reports='insight';go('reports')">Xem tất cả</button>`:''}<button class="btn sm primary" onclick="smartAskAI()">${ic('zap')} Nhờ AI phân tích sâu</button></div></div><div class="card-b">

}

const KW_STOP=new Set(['các','cho','của','những','theo','với','trong','tháng','mới','khoá','khóa','năm','ngày','hàng','dịch','chiến','đẩy','mạnh','cách','được','không','tại','đang','một','này','ưu','đãi']);
function kwNorm(s){return String(s||'').toLowerCase().replace(/["“”'‘’#]/g,' ').replace(/\s+/g,' ').trim()}
function kwTokens(s){return kwNorm(s).split(/[\s,.;:!?()\/\-+&]+/).filter(w=>w.length>=3&&!KW_STOP.has(w)&&!/^\d+%?$/.test(w))}
function kwMatch(a,b){a=kwNorm(a);b=kwNorm(b);if(!a||!b)return false;if(a.includes(b)||b.includes(a))return true;const tb=new Set(kwTokens(b));return kwTokens(a).some(w=>tb.has(w))}
function isVocInsight(i){return /voc|zalo|inbox|messenger|khách|hotline|tổng đài|khảo sát|survey|đánh giá|review|phản hồi|bình luận|comment/i.test((i.src||'')+' '+(i.q||''))}

/* Nhóm từ khoá theo DỰ ÁN: settings.keyword_groups (sửa ở Cài đặt dự án). Chưa đặt → WebSEO dùng nhóm dịch vụ mặc định; dự án khác → Thương hiệu / Giá-mua. */
const MK_TOPICS_WEBSEO=[['Thiết kế website',['thiết kế web','thiet ke web','website','làm web','lam web','web bán hàng','landing','giao diện web','wordpress']],['Hosting / VPS',['hosting','vps','máy chủ','may chu','server','cloud']],['Email doanh nghiệp',['email','mail','gmail','workspace','outlook']],['Tên miền',['tên miền','ten mien','domain','.vn','.com']],['SEO / quảng cáo',['seo','marketing','quảng cáo','quang cao','google ads','từ khoá','tu khoa']],['Thương hiệu WebSEO',['webseo','web seo']]];
function mkTopics(){const p=proj()||{};const st=p.settings||{};const g=st.keyword_groups;if(Array.isArray(g)&&g.length)return g.map(x=>[x.name,(x.words||[]).map(w=>String(w).toLowerCase().trim()).filter(Boolean)]);if(st.crm==='webseo'||/webseo/i.test(p.domain||''))return MK_TOPICS_WEBSEO;const brand=String(p.domain||p.name||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('.')[0];return [['Thương hiệu',brand?[brand]:[]],['Giá / mua ở đâu',['giá','bao nhiêu','bao nhieu','mua','ở đâu','o dau','review','có tốt']]]}
function mkTopic(q){q=String(q).toLowerCase();for(const [n,ws] of mkTopics())if(ws.some(w=>w&&q.includes(w)))return n;return 'Khác'}
function mkGeneric(q){const t=String(q).trim().toLowerCase();return t.split(/\s+/).length<=1||/^(giá|giá bao nhiêu|bao nhiêu tiền|mua|review|có tốt không|là gì)$/.test(t)}
function kwGroupsText(st){const g=(st||{}).keyword_groups;return Array.isArray(g)?g.map(x=>x.name+': '+(x.words||[]).join(', ')).join('\n'):''}
function kwGroupsParse(txt){return String(txt||'').split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(':');if(i<0)return null;return {name:l.slice(0,i).trim(),words:l.slice(i+1).split(/[,;]/).map(w=>w.trim()).filter(Boolean)}}).filter(x=>x&&x.name&&x.words.length)}
function gscConns(){return (DB.connections||[]).filter(c=>c.provider==='gsc'&&c.status==='connected'&&c.metrics&&(c.metrics.items||[]).length)}
function gscTop(c,lbl){return (((c.metrics.top||[]).find(t=>t.label.startsWith(lbl))||{}).rows)||[]}
function gscQueries(){const m={};gscConns().forEach(c=>gscTop(c,'Từ khoá').forEach(r=>{const k=r[0];const o=m[k]||(m[k]={q:k,c:0,i:0,pw:0,site:c.label});o.c+=r[1];o.i+=r[2];o.pw+=r[4]*r[2]}));return Object.values(m).map(o=>({...o,ctr:o.i?o.c/o.i*100:0,p:o.i?o.pw/o.i:0,topic:mkTopic(o.q)})).sort((a,b)=>b.i-a.i)}
function posBand(p){return p<=3?['Top 3','ok']:p<=10?['Trang 1','info']:p<=20?['Trang 2','warn']:['Ngoài top 20','mut']}
function mkBars(rows,fmt){const mx=Math.max(...rows.map(r=>r.v),1);return rows.map((r,i)=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><div style="width:170px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.l)}">${esc(r.l)}</div><div style="flex:1;background:#eef1f5;border-radius:6px;height:14px"><div style="width:${Math.max(2,r.v/mx*100)}%;height:14px;border-radius:6px;background:${r.col||ST_COLORS[i%8]}"></div></div><b class="mono" style="min-width:70px;text-align:right;font-size:12.5px">${fmt?fmt(r.v):num(r.v)}</b></div>`).join('')}
function gscEmpty(){return `<div class="card"><div class="card-b"><div class="empty" style="padding:30px"><div class="ei">${ic('search')}</div><h4>Chưa kết nối Search Console</h4><div class="mini" style="margin-bottom:12px">Từ khoá thật khách gõ trên Google lấy từ Search Console. Dán link website ở ô Kết nối nhanh là xong.</div><button class="btn primary" onclick="go('settings','integ')">${ic('link')} Kết nối website</button></div></div></div>`}
function gscKeywordsHtml(){

   <div class="card"><div class="card-h">${ic('zap')}<h3>Cơ hội lên top nhanh</h3><span class="sub">vị trí 4–20, có hiển thị</span></div><div class="card-b">${opp.length?opp.map(q=>`<div class="dleg"><span>${esc(q.q)}</span><span class="mini" style="margin-left:auto">vị trí ${q.p.toFixed(1)} · ${num(q.i)} hiển thị</span><button class="iconbtn sm" title="Theo dõi xu hướng" onclick="trendAddKw(this,'${esc(q.q).replace(/&#39;/g,'')}')">${ic('plus')}</button></div>`).join(''):'<div class="mini">Chưa có từ khoá ở vị trí 4–20 với đủ hiển thị.</div>'}<div class="mini" style="margin-top:6px">Đẩy từ trang 2 / dưới top 3 lên top 3 là cách tăng click nhanh nhất: viết thêm nội dung đúng ý định tìm kiếm, liên kết nội bộ, tối ưu tiêu đề.</div></div></div></div>

/* Insight tự động: rút ra từ dữ liệu thật, lưu vào kho bằng một nút. */
function autoInsights(){
 const out=[];const qs=gscQueries();
 if(qs.length){const g={};qs.forEach(q=>{g[q.topic]=(g[q.topic]||0)+q.i});const top=Object.entries(g).sort((a,b)=>b[1]-a[1]);const ti=top.reduce((t,x)=>t+x[1],0)||1;
  out.push({q:'Khách tìm WebSEO trên Google vì nhu cầu nào nhiều nhất?',ins:top.slice(0,3).map(([k,v])=>`${k}: ${(v/ti*100).toFixed(0)}% lượt hiển thị (${num(v)})`).join('; ')+'.',src:'Google Search Console',conf:'Cao',subject:top[0][0]});
  const opp=qs.filter(q=>q.p>3&&q.p<=20&&q.i>=10).sort((a,b)=>b.i-a.i).slice(0,5);
  if(opp.length)out.push({q:'Từ khoá nào có thể lên top nhanh nhất?',ins:opp.map(q=>`"${q.q}" (vị trí ${q.p.toFixed(1)}, ${num(q.i)} hiển thị)`).join('; ')+' — đã có hiển thị, chỉ cần tối ưu nội dung + liên kết.',src:'Google Search Console',conf:'Cao',subject:opp[0].topic});
  const low=qs.filter(q=>q.p<=10&&q.i>=30&&q.ctr<2);if(low.length)out.push({q:'Vì sao hiện trang 1 mà ít người bấm?',ins:low.slice(0,5).map(q=>`"${q.q}" CTR ${q.ctr.toFixed(1)}% ở vị trí ${q.p.toFixed(1)}`).join('; ')+' — tiêu đề / mô tả trên Google chưa đủ hấp dẫn.',src:'Google Search Console',conf:'Trung bình',subject:low[0].topic});}
 const d=VOC.d;if(d&&d.total){const it={};d.by_intent.forEach(x=>it[x.k]=+x.n);const buy=(it.hoi_gia||0)+(it.dat_lich||0);
  if(buy)out.push({q:'Bình luận có tạo ra khách tiềm năng không?',ins:`${num(buy)}/${num(d.total)} bình luận (${Math.round(buy/d.total*100)}%) trong ${d.days} ngày là hỏi giá / muốn liên hệ.`,src:'Bình luận Fanpage / YouTube / Google Maps',conf:'Trung bình',subject:''});
  if(it.khieu_nai)out.push({q:'Khách đang phàn nàn điều gì?',ins:`${num(it.khieu_nai)} bình luận tiêu cực / khiếu nại trong ${d.days} ngày — xem chi tiết ở hộp chăm sóc.`,src:'Bình luận kênh',conf:'Trung bình',subject:''});}
 smartFindings().filter(f=>f.sev!=='info'||f.area==='SEO').slice(0,4).forEach(f=>out.push({q:f.title,ins:f.ev+' Nên làm: '+f.act,src:'Phân tích tự động ('+f.area+')',conf:'Trung bình',subject:''}));
 return out;
}

  ${DB.insights.map(i=>`<div class="icard"><div class="ih">${ic('book')}<span class="ihb">${i.q}</span><span style="margin-left:auto;display:flex;gap:6px;align-items:center">${badge({['Đã kiểm chứng']:{t:'Đã kiểm chứng',c:'ok'},['Insight']:{t:'Insight',c:'vio'}},i.state)}<button class="iconbtn sm" title="Xoá" onclick="deleteInsight('${i.id}')">${ic('trash')}</button></span></div><p>${i.ins}</p><div class="im">${subj(i.subject)} ${ref(i.src)} <span class="chip">Độ tin: ${i.conf}</span><span class="chip">${ic('clock')} ${i.fresh}</span></div></div>`).join('')||'<div class="empty"><div class="ei">'+ic('book')+'</div><h4>Chưa có insight nào</h4></div>'}`;

function newInsight(){
 openModal(`<div class="mh">${ic('book')}<h3>Ghi insight mới</h3><button class="x" onclick="closeLayer()">${ic('x')}</button></div>
  <div class="mb">
   <div class="field"><label>Câu hỏi</label><input id="ins-q" placeholder="VD: Vì sao khách rời bỏ ở bước thanh toán?"></div>
   <div class="field"><label>Insight / phát hiện</label><textarea id="ins-ins" rows="3" placeholder="Mô tả phát hiện, bằng chứng cụ thể"></textarea></div>
   <div class="frow f3"><div class="field"><label>Nguồn</label><input id="ins-src" placeholder="VD: Zalo OA + Inbox FB"></div><div class="field"><label>Độ tin cậy</label><select id="ins-conf"><option>Cao</option><option>Trung bình</option><option>Thấp</option></select></div><div class="field"><label>Đối tượng</label><input id="ins-subject" placeholder="VD: Hosting"></div></div>
  </div>
  <div class="mf"><button class="btn" onclick="closeLayer()">Huỷ</button><button class="btn primary" onclick="submitNewInsight()">${ic('plus')} Ghi insight</button></div>`);
}
async function submitNewInsight(){
 const q=$('#ins-q').value.trim();
 const ins=$('#ins-ins').value.trim();
 if(!q||!ins){toast('Thiếu câu hỏi hoặc insight');return}
 try{
  await apiPost('/api/insights.php',{q,ins,src:$('#ins-src').value.trim(),conf:$('#ins-conf').value,subject:$('#ins-subject').value.trim()});
  closeLayer();toast('Đã ghi insight');await refreshData();go('insights');
 }catch(e){toast('Lỗi',e.message)}
}
async function deleteInsight(id){
 if(!confirm('Xoá insight này?'))return;
 try{await apiDelete('/api/insights.php?id='+id);toast('Đã xoá insight');await refreshData();go('insights')}
 catch(e){toast('Lỗi',e.message)}
}

const AP={d:null,sel:{c:{},o:{}}};
function autoPlanBanner(){return `<div class="card" style="border-color:var(--brand,#0d9488)"><div class="card-b" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="ki" style="font-size:22px">${ic('zap')}</span><div style="flex:1;min-width:240px"><b>Tự động lập kế hoạch quý</b><div class="mini">Hệ thống đọc số liệu thật (từ khoá Google, trang CTR thấp, bình luận chờ, nguồn đo còn thiếu) và đề xuất chiến dịch + công việc + OKR cho WebSEO. Anh/chị xem, bỏ chọn mục không cần rồi bấm Tạo.</div></div><button class="btn primary" onclick="autoPlanOpen()">${ic('zap')} Lập kế hoạch tự động</button></div></div>`}
async function autoPlanOpen(){
 openModal(`<div class="mh">${ic('zap')}<h3>Kế hoạch đề xuất từ dữ liệu thật</h3><button class="x" onclick="closeLayer()">${ic('x')}</button></div><div class="mb" id="ap-body"><div class="empty">Đang phân tích dữ liệu…</div></div><div class="mf" id="ap-foot"></div>`,'wide');
 try{AP.d=await apiGet('/api/plan_auto.php')}catch(e){$('#ap-body').innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`;return}
 AP.sel={c:{},o:{}};AP.d.campaigns.forEach((c,i)=>{if(!c.exists)AP.sel.c[i]=true});AP.d.okrs.forEach((o,i)=>{if(!o.exists)AP.sel.o[i]=true});
 autoPlanRender();
}
function autoPlanRender(){
 const d=AP.d;
 $('#ap-body').innerHTML=`<div class="mini" style="margin-bottom:10px">Quý <b>${esc(d.quarter)}</b> · ${fmtD(d.period[0])} → ${fmtD(d.period[1])}. Chiến dịch tạo ở trạng thái <b>Lên kế hoạch · chờ duyệt</b>; ngân sách để 0 — anh/chị điền khi duyệt.</div>
  <h4 style="margin:8px 0">Chiến dịch & công việc (${d.campaigns.length})</h4>
  ${d.campaigns.map((c,i)=>`<label class="icard" style="display:block;cursor:${c.exists?'default':'pointer'};opacity:${c.exists?.55:1}"><div class="ih"><input type="checkbox" ${AP.sel.c[i]?'checked':''} ${c.exists?'disabled':''} onchange="AP.sel.c[${i}]=this.checked"><span class="ihb">${esc(c.name)}</span><span class="chip">${esc(c.why||'')}</span>${c.exists?'<span class="badge b-mut">Đã có</span>':''}</div><p class="mini" style="margin:4px 0">${esc(c.obj)}</p><ul class="mini" style="margin:4px 0 0 18px">${c.tasks.map(t=>`<li>[${t.pri}] ${esc(t.title)} — hạn ${fmtD(t.due)}</li>`).join('')}</ul></label>`).join('')}
  <h4 style="margin:14px 0 8px">OKR (${d.okrs.length})</h4>
  ${d.okrs.map((o,i)=>`<label class="dleg" style="cursor:pointer;opacity:${o.exists?.55:1}"><input type="checkbox" ${AP.sel.o[i]?'checked':''} ${o.exists?'disabled':''} onchange="AP.sel.o[${i}]=this.checked"><span><b>${esc(o.objective)}</b> — ${esc(o.kr)}</span><span class="mini" style="margin-left:auto;white-space:nowrap">hiện ${num(o.current)} → mục tiêu ${num(o.target)} ${esc(o.unit)}${o.metric!=='manual'?' · tự tính':''}</span></label>`).join('')}
  <div class="mini" style="margin-top:8px">Mục tiêu OKR là đề xuất (vd click ×2, +5 từ khoá top 10, 90% bình luận được trả lời) — sửa được sau khi tạo ở tab Mục tiêu & OKR.</div>`;
 $('#ap-foot').innerHTML=`<button class="btn" onclick="closeLayer()">Huỷ</button><button class="btn primary" id="ap-go" onclick="autoPlanCreate()">${ic('check')} Tạo các mục đã chọn</button>`;
}
async function autoPlanCreate(){
 const c=Object.keys(AP.sel.c).filter(k=>AP.sel.c[k]).map(Number),o=Object.keys(AP.sel.o).filter(k=>AP.sel.o[k]).map(Number);
 if(!c.length&&!o.length){toast('Chưa chọn mục nào');return}
 const b=$('#ap-go');b.disabled=true;b.textContent='Đang tạo…';
 try{const d=await apiPost('/api/plan_auto.php',{campaigns:c,okrs:o});closeLayer();await refreshData();toast('Đã lập kế hoạch',`${d.made.campaigns} chiến dịch · ${d.made.tasks} công việc · ${d.made.okrs} OKR`)}
 catch(e){toast('Lỗi',e.message);b.disabled=false;b.textContent='Tạo các mục đã chọn'}
}

function pgPlan(){
 const t=tabOf('plan','okr');
 const tabs=[['okr','Mục tiêu & OKR','target'],['plan','Kế hoạch theo quý','doc'],['budget','Ngân sách','wallet']];
 let body='',act='';
 if(t==='okr'){
  if(!OKR_AT||Date.now()-OKR_AT>30000)okrLoad();
  const all=okrList(),q=fget('okrq',qNow());
  const rows=all.filter(o=>o.quarter===q);
  const objs=[...new Set(rows.map(o=>o.objective))];OKR_OBJS=objs;
  const avg=rows.length?Math.round(sum(rows,o=>okrPct(o))/rows.length):0;
  const qs=[...new Set([q,qNow(),...all.map(o=>o.quarter)])].sort().reverse();
  const can=isManager();
  act=`${all.length?`<button class="btn" onclick="exportOkr()">${ic('download')} Xuất CSV</button>`:''}${can?`<button class="btn primary" onclick="okrForm(null,'${q}')">${ic('plus')} Thêm KR</button>`:''}`;
  body=`<div class="filterbar"><button class="btn sm" title="Quý trước" onclick="fset('okrq','${qShift(q,-1)}')">‹</button><b style="min-width:70px;text-align:center">${qLabel(q)}</b><button class="btn sm" title="Quý sau" onclick="fset('okrq','${qShift(q,1)}')">›</button>
   <select onchange="fset('okrq',this.value)">${qs.map(x=>`<option value="${x}"${x===q?' selected':''}>${qLabel(x)} · ${all.filter(o=>o.quarter===x).length} KR</option>`).join('')}</select>
   ${q!==qNow()?`<button class="btn sm" onclick="fset('okrq','${qNow()}')">Quý hiện tại</button>`:''}
   <div class="fb-act">${can?'':'<span class="mini">Chỉ xem — trưởng nhóm / quản trị mới sửa được OKR</span>'}</div></div>`;
  if(!rows.length){body+=`<div class="empty"><div class="ei">${ic('target')}</div><h4>Chưa có OKR cho ${qLabel(q)}</h4><div class="mini" style="margin-bottom:12px">Đặt mục tiêu và kết quả then chốt. "Hiện tại" có thể nhập tay hoặc để hệ thống tự tính từ chiến dịch, nội dung, công việc thật.</div>${can?`<button class="btn primary" onclick="okrForm(null,'${q}')">${ic('plus')} Tạo OKR đầu tiên</button>`:''}</div>`}
  else{
   body+=`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi('Mục tiêu',objs.length,'flag','#7c3aed')}${kpi('Kết quả then chốt',rows.length,'target','#2563eb')}${kpi('Tiến độ trung bình',avg+'%','trend','#0d9488')}</div>`
   +objs.map((ob,oi)=>{const krs=rows.filter(o=>o.objective===ob);const p=Math.round(sum(krs,o=>okrPct(o))/krs.length);
    return `<div class="card"><div class="card-h">${ic('flag')}<h3>${esc(ob)}</h3><span class="sub">${krs.length} KR · tiến độ ${p}%</span>${can?`<div class="hact"><button class="btn sm" onclick="okrForm(null,'${q}',${oi})">${ic('plus')} Thêm KR</button></div>`:''}</div>
     <div class="tbl-wrap" style="border:0;box-shadow:none"><table class="tbl"><thead><tr><th>Kết quả then chốt</th><th>Phụ trách</th><th class="tar">Chỉ tiêu</th><th class="tar">Hiện tại</th><th style="width:190px">Tiến độ</th>${can?'<th></th>':''}</tr></thead><tbody>
     ${krs.map(o=>{const pc=okrPct(o);const st=DB.staff.find(s=>s.id===o.owner);const col=pc>=100?'var(--ok)':pc>=70?'':pc>=40?'var(--warn)':'var(--bad)';
      return `<tr><td><b>${esc(o.kr)}</b><div class="r-mut">${o.dir<0?'Càng thấp càng tốt':'Càng cao càng tốt'}${o.metric&&o.metric!=='manual'?` · <span class="tag" title="${esc((OKR_METRICS[o.metric]||{}).h||'')}">${esc((OKR_METRICS[o.metric]||{t:o.metric}).t)}</span>`:' · nhập tay'}</div></td><td>${st?esc(st.name):'<span class="r-mut">—</span>'}</td><td class="tar mono">${o.dir<0?'≤ ':''}${okrFmt(o.target,o.unit)}</td><td class="tar mono"><b>${okrFmt(o.current,o.unit)}</b></td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog" style="flex:1"><div style="width:${pc}%;${col?'background:'+col:''}"></div></div><span class="mono" style="font-size:12px">${pc}%</span></div></td>${can?`<td class="tar" style="white-space:nowrap"><button class="iconbtn sm" title="Sửa" onclick="okrForm('${o.id}')">${ic('edit')}</button><button class="iconbtn sm" title="Xoá" onclick="deleteOkr('${o.id}')">${ic('trash')}</button></td>`:''}</tr>`}).join('')}
     </tbody></table></div></div>`}).join('')
   +`<div class="mech"><p class="note"><b>Cách tính</b>KR "tự tính" lấy số thật của quý: chiến dịch có thời gian giao với quý (trừ đã huỷ) cho lead / chi tiêu / ROAS (bình quân theo chi tiêu) / CPL (chi tiêu ÷ lead); nội dung "Đã xuất bản" và công việc ở cột cuối bảng được cập nhật trong quý. Tiến độ = hiện tại ÷ chỉ tiêu (KR càng thấp càng tốt: chỉ tiêu ÷ hiện tại), tối đa 100%.</p></div>`;
  }
 }
 else if(t==='plan'){
  const list=DB.campaigns.filter(inScope);
  const groups={};list.forEach(c=>{const k=qOf(c.start)||'none';(groups[k]=groups[k]||[]).push(c)});
  const keys=Object.keys(groups).filter(k=>k!=='none').sort();if(groups.none)keys.push('none');
  act=`<button class="btn primary" onclick="newCampaign()">${ic('plus')} Tạo chiến dịch</button>`;
  body=keys.length?keys.map(k=>{const cs=groups[k].slice().sort((a,b)=>(a.start||'').localeCompare(b.start||''));const okn=okrList().filter(o=>o.quarter===k).length;
   const tb=sum(cs,c=>c.budget),ts=sum(cs,c=>c.spent),tl=sum(cs,c=>c.leads);
   return `<div class="card"><div class="card-h">${ic('calendar')}<h3>${k==='none'?'Chưa có ngày bắt đầu':qLabel(k)}</h3><span class="sub">${cs.length} chiến dịch · ngân sách ${M(tb)} · đã chi ${M(ts)}${k!=='none'?` · ${okn} KR`:''}</span>${k!=='none'&&okn?`<div class="hact"><button class="btn sm" onclick="S.flt.plan=S.flt.plan||{};S.flt.plan.okrq='${k}';setTab('plan','okr')">${ic('target')} Xem OKR</button></div>`:''}</div>
    <div class="tbl-wrap" style="border:0;box-shadow:none"><table class="tbl"><thead><tr><th>Chiến dịch</th><th>Đối tượng</th><th>Đơn vị</th><th>Thời gian</th><th>Trạng thái</th><th class="tar">Ngân sách</th><th class="tar">Đã chi</th><th class="tar">Lead</th></tr></thead><tbody>
    ${cs.map(c=>`<tr class="clk" onclick="openCamp('${c.id}')"><td><b>${esc(c.name)}</b></td><td>${c.subject?subj(esc(c.subject)):'—'}</td><td class="r-mut">${esc(coName(c.co).split('—')[0].trim())} · ${esc(brName(c.br))}</td><td class="mono r-mut" style="white-space:nowrap">${c.start||'?'} → ${c.end||'?'}</td><td>${badge(CAMPST,c.state)} ${c.approval==='PENDING'?badge(APRST,'PENDING'):''}</td><td class="tar mono">${M(c.budget)}</td><td class="tar mono">${M(c.spent)}</td><td class="tar mono">${num(c.leads)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="5">Tổng ${cs.length} chiến dịch</td><td class="tar mono">${M(tb)}</td><td class="tar mono">${M(ts)}</td><td class="tar mono">${num(tl)}</td></tr></tfoot></table></div></div>`}).join('')
   +`<div class="mini">Nhóm theo quý của ngày bắt đầu chiến dịch · ${per()}</div>`
   :`<div class="empty"><div class="ei">${ic('doc')}</div><h4>Chưa có chiến dịch nào trong phạm vi này</h4><div class="mini" style="margin-bottom:12px">Kế hoạch theo quý được lập từ chính các chiến dịch đã tạo.</div><button class="btn primary" onclick="newCampaign()">${ic('plus')} Tạo chiến dịch</button></div>`;
 }
 else {
  const list=DB.campaigns.filter(inScope);
  const byCo=S.scope.co==='all';
  const agg=(key,label)=>{const m={};list.forEach(c=>{const k=c[key]||'';if(!m[k])m[k]={k,label:label(k,c),budget:0,spent:0,n:0};m[k].budget+=c.budget||0;m[k].spent+=c.spent||0;m[k].n++});return Object.values(m).sort((a,b)=>b.budget-a.budget)};
  const cos=agg('co',k=>k?coName(k).split('—')[0].trim():'Chưa gán công ty');
  const brs=agg('br',(k,c)=>k?brName(k)+(byCo?' · '+coName(c.co).split('—')[0].trim():''):'Chưa gán chi nhánh');
  const tb=sum(list,c=>c.budget),ts=sum(list,c=>c.spent);
  const tbl=(rows,title)=>`<table class="tbl"><thead><tr><th>${title}</th><th class="tar">Chiến dịch</th><th class="tar">Ngân sách</th><th class="tar">Đã chi</th><th class="tar">Còn lại</th><th style="width:150px">% đã dùng</th></tr></thead><tbody>${rows.map(r=>{const p=r.budget?Math.round(r.spent/r.budget*100):0;return `<tr><td><b>${esc(r.label)}</b></td><td class="tar mono">${r.n}</td><td class="tar mono">${M(r.budget)}</td><td class="tar mono">${M(r.spent)}</td><td class="tar mono ${r.budget-r.spent<0?'neg':''}">${M(r.budget-r.spent)}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog" style="flex:1"><div style="width:${Math.min(100,p)}%;${p>100?'background:var(--bad)':''}"></div></div><span class="mono" style="font-size:12px">${p}%</span></div></td></tr>`}).join('')}</tbody><tfoot><tr><td>Tổng</td><td class="tar mono">${list.length}</td><td class="tar mono">${M(tb)}</td><td class="tar mono">${M(ts)}</td><td class="tar mono">${M(tb-ts)}</td><td class="mono">${tb?Math.round(ts/tb*100):0}%</td></tr></tfoot></table>`;
  const dsrc=(byCo?cos:brs).filter(r=>r.budget>0);
  body=list.length?`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi('Tổng ngân sách',M(tb),'wallet','#7c3aed')}${kpi('Đã chi',M(ts)+(tb?' · '+Math.round(ts/tb*100)+'%':''),'trend','#0d9488')}${kpi('Còn lại',M(tb-ts),'target','#2563eb')}</div>
   <div class="grid2"><div class="card"><div class="card-h">${ic('wallet')}<h3>Ngân sách vs. thực chi theo công ty</h3></div><div class="card-b" style="overflow-x:auto">${tbl(cos,'Công ty')}</div></div>
   <div class="card"><div class="card-h">${ic('wallet')}<h3>Tỉ trọng ngân sách theo ${byCo?'công ty':'chi nhánh'}</h3></div><div class="card-b">${dsrc.length?chDonut(dsrc.map((r,i)=>({label:esc(r.label),value:r.budget,color:PAL8[i%PAL8.length]}))):'<div class="mini">Chưa có chiến dịch nào nhập ngân sách</div>'}</div></div></div>
   <div class="card"><div class="card-h">${ic('building')}<h3>Ngân sách vs. thực chi theo chi nhánh</h3></div><div class="card-b" style="overflow-x:auto">${tbl(brs,'Chi nhánh')}</div></div>
   <div class="mini">Tổng hợp từ ngân sách và số đã chi ghi trên từng chiến dịch · ${per()}. Cập nhật số chi ở trang Chiến dịch.</div>`
   :`<div class="empty"><div class="ei">${ic('wallet')}</div><h4>Chưa có chiến dịch nào trong phạm vi này</h4><div class="mini" style="margin-bottom:12px">Ngân sách được tổng hợp từ các chiến dịch.</div><button class="btn primary" onclick="newCampaign()">${ic('plus')} Tạo chiến dịch</button></div>`;
 }
 return `<div class="pagehead"><div><h1>Kế hoạch Marketing</h1><div class="sub">${per()} · Mục tiêu, kế hoạch quý và ngân sách lấy từ dữ liệu thật</div></div><div class="ph-act"><button class="btn" onclick="autoPlanOpen()">${ic('zap')} Lập kế hoạch tự động</button>${act}</div></div>${autoPlanBanner()}${seg('plan',tabs,t)}${body}`;
}
/* ---- OKR helpers ---- */
const PAL8=['#7c3aed','#2563eb','#0d9488','#db2777','#d97706','#0891b2','#e8750a','#64748b'];
const OKR_METRICS={
 manual:{t:'Nhập tay',u:'',h:'Tự nhập số hiện tại'},
 leads:{t:'Tự tính: lead',u:'lead',d:1,h:'Tổng lead của các chiến dịch có thời gian giao với quý (trừ chiến dịch đã huỷ)'},
 spend:{t:'Tự tính: chi tiêu',u:'₫',d:-1,h:'Tổng số đã chi của các chiến dịch có thời gian giao với quý'},
 roas:{t:'Tự tính: ROAS',u:'x',d:1,h:'ROAS bình quân gia quyền theo chi tiêu của các chiến dịch trong quý'},
 cpl:{t:'Tự tính: CPL',u:'₫',d:-1,h:'Tổng chi tiêu ÷ tổng lead của các chiến dịch trong quý'},

function qOf(d){const m=/^(\d{4})-(\d{2})/.exec(d||'');return m?m[1]+'-Q'+Math.ceil(+m[2]/3):null}
function qNow(){const d=new Date();return d.getFullYear()+'-Q'+(Math.floor(d.getMonth()/3)+1)}
function qLabel(q){const m=/^(\d{4})-Q(\d)$/.exec(q||'');return m?'Q'+m[2]+'/'+m[1]:String(q||'')}
function qShift(q,n){const m=/^(\d{4})-Q(\d)$/.exec(q)||[0,new Date().getFullYear(),1];const i=(+m[1])*4+(+m[2]-1)+n;return Math.floor(i/4)+'-Q'+(i%4+1)}
function okrPct(o){const t=+o.target||0,c=+o.current||0;if(o.dir<0){if(c<=0||t<=0)return 0;return Math.round(Math.min(1,t/c)*100)}if(t<=0)return 0;return Math.round(Math.max(0,Math.min(1,c/t))*100)}
function okrFmt(v,u){v=+v||0;u=(u||'').trim();if(u==='₫'||u==='đ'||/^vn[dđ]$/i.test(u))return M(Math.round(v));if(u==='x')return (Math.round(v*100)/100)+'x';if(u==='%')return (Math.round(v*10)/10)+'%';return num(Math.round(v*100)/100)+(u?' '+esc(u):'')}

/* ================= XƯỞNG ẢNH CAROUSEL (vẽ trên trình duyệt, không cần dịch vụ ngoài) =================
   Dán bài viết → tách trang (dấu --- hoặc tự chia theo đoạn) → vẽ từng ảnh 1080px theo màu thương hiệu → tải PNG hoặc đưa thẳng vào bài đăng. */
const STU={text:'',size:'1080x1080',theme:0,brand:'WebSEO',foot:'webseo.com.vn · 0988 227 905',cta:true,busy:false};
const STU_THEMES=[{n:'Tím thương hiệu',bg:['#4f46e5','#7c3aed'],fg:'#ffffff',acc:'#fde68a'},{n:'Đêm xanh',bg:['#0f172a','#1e3a8a'],fg:'#ffffff',acc:'#38bdf8'},{n:'Trắng sạch',bg:['#ffffff','#eef2ff'],fg:'#0f172a',acc:'#7c3aed'},{n:'Xanh ngọc',bg:['#0d9488','#065f46'],fg:'#ffffff',acc:'#fef08a'},{n:'Cam hồng',bg:['#f97316','#db2777'],fg:'#ffffff',acc:'#fff7ed'}];
function stuSlides(){
 const t=STU.text.trim();if(!t)return [];
 let parts=/\n\s*---+\s*\n/.test(t)?t.split(/\n\s*---+\s*\n/):t.split(/\n\s*\n/);
 parts=parts.map(x=>x.trim()).filter(Boolean);
 const out=[];parts.forEach(p=>{const w=p.split(/\s+/);if(w.length<=55)out.push(p);else for(let i=0;i<w.length;i+=45)out.push(w.slice(i,i+45).join(' '))});
 if(STU.cta)out.push('__CTA__');
 return out.slice(0,10);
}
function stuWrap(ctx,text,maxW){const lines=[];text.split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t});lines.push(line)});return lines}
function stuDraw(cv,txt,i,n){
 const [W,H]=STU.size.split('x').map(Number),th=STU_THEMES[STU.theme],ctx=cv.getContext('2d');cv.width=W;cv.height=H;
 const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,th.bg[0]);g.addColorStop(1,th.bg[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.12;ctx.fillStyle=th.acc;ctx.beginPath();ctx.arc(W*.92,H*.08,W*.32,0,7);ctx.fill();ctx.beginPath();ctx.arc(W*.05,H*.98,W*.22,0,7);ctx.fill();ctx.globalAlpha=1;
 const F="'Segoe UI','Helvetica Neue',Arial,sans-serif",pad=90;
 ctx.fillStyle=th.fg;ctx.font=`700 34px ${F}`;ctx.fillText(STU.brand,pad,pad+10);
 ctx.font=`600 30px ${F}`;ctx.textAlign='right';ctx.globalAlpha=.75;ctx.fillText(`${i+1}/${n}`,W-pad,pad+10);ctx.globalAlpha=1;ctx.textAlign='left';
 ctx.fillStyle=th.acc;ctx.fillRect(pad,pad+36,90,8);
 const cta=txt==='__CTA__',cover=i===0&&!cta;
 let title='',body=txt;
 if(cta){title='Cần tư vấn?';body='Nhắn tin hoặc gọi ngay để được tư vấn miễn phí.\n'+STU.foot}
 else{const ls=txt.split('\n');if(cover||(ls.length>1&&ls[0].length<=80)){title=ls[0];body=ls.slice(1).join('\n')}}
 const maxW=W-pad*2,top=pad+110,bottom=H-pad-70;let y=top;
 if(title){let fs=cover||cta?96:72,tl;do{ctx.font=`800 ${fs}px ${F}`;tl=stuWrap(ctx,title,maxW);fs-=4}while(tl.length*fs*1.15>(bottom-top)*.6&&fs>40);
  ctx.fillStyle=th.fg;tl.forEach(l=>{y+=fs*1.15;ctx.fillText(l,pad,y)});y+=30}
 if(body.trim()){let fs=cover?44:56,bl;do{ctx.font=`500 ${fs}px ${F}`;bl=stuWrap(ctx,body,maxW);fs-=2}while(y+bl.length*fs*1.4>bottom&&fs>26);
  ctx.fillStyle=th.fg;ctx.globalAlpha=cover?.9:1;bl.forEach(l=>{y+=fs*1.4;if(y<bottom+fs)ctx.fillText(l,pad,y)});ctx.globalAlpha=1}
 ctx.fillStyle=th.fg;ctx.globalAlpha=.8;ctx.font=`600 30px ${F}`;ctx.fillText(STU.foot,pad,H-pad+10);ctx.globalAlpha=1;
 if(i<n-1){ctx.textAlign='right';ctx.fillStyle=th.acc;ctx.font=`700 34px ${F}`;ctx.fillText('Vuốt tiếp →',W-pad,H-pad+10);ctx.textAlign='left'}
}
function stuRender(){const sl=stuSlides(),box=document.getElementById('stu-prev');if(!box)return;
 box.innerHTML=sl.length?sl.map((_,i)=>`<canvas id="stu-cv-${i}" style="width:220px;border-radius:10px;box-shadow:0 2px 10px #0002"></canvas>`).join(''):'<div class="mini">Dán nội dung vào ô bên trái để xem trước.</div>';
 sl.forEach((t,i)=>stuDraw(document.getElementById('stu-cv-'+i),t,i,sl.length));
 const c=document.getElementById('stu-count');if(c)c.textContent=sl.length+' ảnh';}

 return `<div class="grid2" style="grid-template-columns:minmax(300px,420px) 1fr;align-items:start">

   <div class="field"><label>Màu</label><select onchange="stuSet('theme',+this.value)">${STU_THEMES.map((t,i)=>`<option value="${i}" ${STU.theme===i?'selected':''}>${t.n}</option>`).join('')}</select></div></div>
  <div class="frow"><div class="field"><label>Tên thương hiệu</label><input value="${esc(STU.brand)}" oninput="stuSet('brand',this.value)"></div><div class="field"><label>Chân ảnh</label><input value="${esc(STU.foot)}" oninput="stuSet('foot',this.value)"></div></div>
  <label class="dleg" style="cursor:pointer"><input type="checkbox" style="width:auto" ${STU.cta?'checked':''} onchange="stuSet('cta',this.checked)"> Thêm ảnh kêu gọi liên hệ ở cuối</label>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" ${STU.busy?'disabled':''} onclick="stuToPost()">${ic('send')} ${STU.busy?'Đang tải ảnh lên…':'Đưa vào bài đăng'}</button><button class="btn" onclick="stuDownload()">${ic('download')} Tải PNG</button></div>
 </div></div>
 <div class="card" style="margin:0"><div class="card-h"><h3>Xem trước</h3><span class="sub" id="stu-count"></span></div><div class="card-b"><div id="stu-prev" style="display:flex;flex-wrap:wrap;gap:12px"></div></div></div></div>`;
}
function stuDownload(){const sl=stuSlides();sl.forEach((_,i)=>{const cv=document.getElementById('stu-cv-'+i);if(!cv)return;const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=`carousel-${i+1}.png`;document.body.appendChild(a);a.click();a.remove()})}
async function stuToPost(){
 const sl=stuSlides();if(!sl.length){toast('Chưa có nội dung');return}
 STU.busy=true;render();const media=[];
 try{for(let i=0;i<sl.length;i++){const cv=document.getElementById('stu-cv-'+i)||(()=>{const c=document.createElement('canvas');stuDraw(c,sl[i],i,sl.length);return c})();
   const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const fd=new FormData();fd.append('file',blob,`carousel-${i+1}.png`);
   const r=await fetch('/api/upload.php',{method:'POST',credentials:'same-origin',headers:PH(),body:fd});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Lỗi '+r.status));media.push({path:j.path,type:j.type,name:j.name})}
  const P=pubS();P.d=pubNew();P.d.title=STU.text.trim().split('\n')[0].slice(0,100);P.d.body=STU.text.replace(/\n\s*---+\s*\n/g,'\n\n').trim();P.d.media=media;
  STU.busy=false;S.tab.publish='compose';go('publish');toast('Đã đưa '+media.length+' ảnh vào bài đăng mới','Chọn kênh rồi Gửi duyệt / Duyệt & đăng')}
 catch(e){STU.busy=false;render();toast('Không tải ảnh lên được',e.message)}
}

const BOT={loaded:false,d:null,open:null,hist:{},busy:{}};
async function botLoad(){try{BOT.d=await apiGet('/api/bot.php')}catch(e){BOT.d={error:e.message}}BOT.loaded=true;if(S.page==='robot')render()}
async function botHist(id){try{BOT.hist[id]=await apiGet('/api/bot.php?id='+encodeURIComponent(id)+'&history=1')}catch(e){BOT.hist[id]={error:e.message}}if(S.page==='robot')render()}
function botStatus(s){return {running:'<span class="badge b-info">Đang chạy…</span>',ok:'<span class="badge b-ok">Thành công</span>',partial:'<span class="badge b-warn">Một phần</span>',error:'<span class="badge b-bad">Lỗi</span>'}[s]||'<span class="badge b-mut">Chưa chạy</span>'}
function botRankHtml(j){
 const l=j.last||{},rows=l.rows||[],h=(BOT.hist[j.id]||{}).runs||[];
 if(!rows.length)return `<div class="mini">${l.error?esc(l.error):'Chưa có kết quả — bấm Chạy ngay.'}</div>`;
 const series=kw=>h.slice().reverse().map(r=>((r.result.rows||[]).find(x=>x.kw===kw)||{}).pos).filter(v=>v!==undefined);
 const comp=Object.entries(l.competitors||{}).filter(([d])=>!d.endsWith(j.config.domain));
 return `<div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${kpi('Từ khoá theo dõi',rows.length,'search','#2563eb')}${kpi('Có mặt trên Google',l.found+'/'+rows.length,'eye','#7c3aed','trong top '+(l.depth||10))}${kpi('Vào top 10',l.top10,'trophy','#0d9488','trang 1 Google')}${kpi('Vị trí trung bình',l.avg??'—','trend','#d97706','các từ khoá có mặt')}</div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Từ khoá</th><th class="tar">Vị trí</th><th class="tar">Thay đổi</th><th>Diễn biến</th><th>Trang xếp hạng</th><th>Đang đứng top 3</th><th>Trên trang Google có</th></tr></thead><tbody>
  ${rows.map(r=>{const s=series(r.kw),prev=s.length>1?s[s.length-2]:undefined,ch=prev!=null&&r.pos!=null?prev-r.pos:null;const sp=s.filter(v=>v!=null);
   return `<tr><td><b>${esc(r.kw)}</b></td><td class="tar mono"><span class="badge b-${r.pos==null?'mut':r.pos<=3?'ok':r.pos<=10?'info':r.pos<=20?'warn':'mut'}">${r.pos??'ngoài top '+(l.depth||10)}</span></td>
   <td class="tar mono" style="color:${ch>0?'var(--ok)':ch<0?'var(--bad)':'inherit'}">${ch==null?'—':ch>0?'▲ '+ch:ch<0?'▼ '+(-ch):'='}</td><td>${sp.length>1?chSpark(sp.map(v=>101-v),'#2563eb'):'<span class="mini">cần ≥2 lần chạy</span>'}</td>
   <td class="mini" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url.replace(/^https?:\/\/[^/]+/,'')||'/')}</a>`:'—'}</td>
   <td class="mini">${r.top.slice(0,3).map(t=>esc(t.domain)).join(', ')}</td><td class="mini">${esc((r.features||[]).join(', ')||'—')}</td></tr>`}).join('')}</tbody></table></div>
  ${comp.length?`<div class="card" style="margin-top:12px"><div class="card-h"><h3>Đối thủ xuất hiện nhiều nhất trong top 10</h3><span class="sub">${esc(fmtTs(j.last_run_at))}</span></div><div class="card-b">${mkBars(comp.slice(0,10).map(([d,n])=>({l:d,v:n})),v=>v+' từ khoá')}<div class="mini" style="margin-top:6px">Gợi ý: thêm các tên miền này vào Thị trường & đối thủ để tự theo dõi website của họ.</div></div></div>`:''}
  ${(l.errors||[]).length?`<div class="mini" style="color:var(--bad);margin-top:6px">${esc(l.errors.join(' · '))}</div>`:''}`;
}
function botShotHtml(j){
 const h=(BOT.hist[j.id]||{}).runs||[],last=j.last||{};
 if(!(last.shots||[]).length)return `<div class="mini">${last.error?esc(last.error):'Chưa có ảnh — bấm Chạy ngay.'}</div>`;
 return `<div style="display:flex;gap:14px;flex-wrap:wrap">${last.shots.map(s=>`<a href="/${esc(s.img)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><div style="width:${s.device==='mobile'?140:300}px;height:${s.device==='mobile'?260:220}px;overflow:hidden;border-radius:10px;border:1px solid #e5e7eb;background:#f8fafc"><img src="/${esc(s.img)}" loading="lazy" style="width:100%"></div><div class="mini" style="max-width:300px">${s.device==='mobile'?'📱':'🖥'} ${esc(s.url.replace(/^https?:\/\//,''))}</div></a>`).join('')}</div>
  ${h.length>1?`<h4 style="margin:14px 0 6px">Lịch sử chụp</h4><div style="display:flex;gap:8px;overflow-x:auto">${h.slice(1,13).map(r=>(r.result.shots||[]).filter(s=>s.device!=='mobile').slice(0,1).map(s=>`<a href="/${esc(s.img)}" target="_blank" rel="noopener" title="${esc(fmtTs(r.at))}"><div style="width:140px;height:100px;overflow:hidden;border-radius:8px;border:1px solid #e5e7eb"><img src="/${esc(s.img)}" loading="lazy" style="width:100%"></div><div class="mini">${esc(fmtTs(r.at))}</div></a>`).join('')).join('')}</div>`:''}`;
}
function pgRobot(){
 if(!BOT.loaded){botLoad();return '<div class="empty">Đang tải…</div>'}
 const d=BOT.d||{};if(d.error)return `<div class="card"><div class="card-b">${esc(d.error)}</div></div>`;
 (d.jobs||[]).forEach(j=>{if(!BOT.hist[j.id]){BOT.hist[j.id]={runs:[]};botHist(j.id)}});
 return `<div class="pagehead"><div><h1>Robot duyệt web</h1><div class="sub">Tự kiểm tra thứ hạng Google và chụp màn hình website theo lịch — chạy trên máy chủ, có thay đổi lớn sẽ báo (app + Telegram)</div></div>
  <div class="ph-act"><button class="btn" onclick="botEdit(null,'shot')">${ic('eye')} Thêm việc chụp màn hình</button><button class="btn primary" onclick="botEdit(null,'rank')">${ic('search')} Thêm việc theo dõi thứ hạng</button></div></div>
  <div class="filterbar"><span class="chip">${d.chrome?'✓ Trình duyệt chạy ngầm sẵn sàng':'✗ Máy chủ chưa có trình duyệt'}</span><span class="chip">${d.serpapi?'✓ Khoá SerpApi (Google)':'✗ Chưa có khoá SerpApi — Thiết lập → Nguồn dữ liệu thị trường'}</span><span class="mini">Mỗi từ khoá mỗi lần kiểm tra tốn 1 lượt SerpApi (gói miễn phí 100 lượt/tháng).</span></div>
  ${(d.jobs||[]).length?d.jobs.map(j=>`<div class="card"><div class="card-h">${ic(j.kind==='rank'?'search':'eye')}<div><h3>${esc(j.name)}</h3><div class="sub">${esc(d.kinds[j.kind]||j.kind)} · ${esc(d.schedules[j.schedule]||j.schedule)}${j.enabled?'':' · đang tắt'} · ${j.last_run_at?'chạy '+relTime(j.last_run_at):'chưa chạy'} ${botStatus(j.last_status)}</div></div>
   <div class="hact"><button class="btn sm primary" ${BOT.busy[j.id]?'disabled':''} onclick="botRun('${j.id}')">${ic('trend')} ${BOT.busy[j.id]?'Đang chạy…':'Chạy ngay'}</button><button class="iconbtn" title="Sửa" onclick="botEdit('${j.id}')">${ic('edit')}</button><button class="iconbtn" title="Xoá" onclick="botDel('${j.id}')">${ic('trash')}</button></div></div>
   <div class="card-b">${j.kind==='rank'?botRankHtml(j):botShotHtml(j)}</div></div>`).join(''):`<div class="card"><div class="card-b"><div class="empty" style="padding:30px"><h4>Chưa có việc nào</h4><div class="mini">Thêm việc theo dõi thứ hạng Google (gợi ý sẵn từ khoá thật từ Search Console) hoặc chụp màn hình website đối thủ.</div></div></div></div>`}`;
}
async function botEdit(id,kind){
 const j=id?(BOT.d.jobs||[]).find(x=>x.id===id):null;kind=j?j.kind:kind;const c=j?j.config:{};let sug={keywords:[],domain:''};
 if(!j&&kind==='rank'){try{sug=await apiPost('/api/bot.php',{action:'suggest'})}catch(e){}}
 const sch=Object.entries(BOT.d.schedules).map(([k,v])=>`<option value="${k}" ${(j?j.schedule:'weekly')===k?'selected':''}>${esc(v)}</option>`).join('');
 openModal(`<div class="mh">${ic(kind==='rank'?'search':'eye')}<h3>${j?'Sửa':'Thêm'} việc: ${esc(BOT.d.kinds[kind])}</h3><button class="x" onclick="closeLayer()">${ic('x')}</button></div><div class="mb">
  <div class="frow"><div class="field"><label>Tên</label><input id="bt-name" value="${esc(j?j.name:(kind==='rank'?'Thứ hạng Google '+(sug.domain||''):'Chụp website đối thủ'))}"></div><div class="field"><label>Lịch chạy</label><select id="bt-sch">${sch}</select></div></div>
  ${kind==='rank'?`<div class="field"><label>Tên miền cần theo dõi</label><input id="bt-dom" value="${esc(c.domain||sug.domain||'')}" placeholder="webseo.com.vn"></div>
   <div class="field"><label>Từ khoá (mỗi dòng 1 từ, tối đa 20)</label><textarea id="bt-kw" rows="8">${esc((c.keywords||sug.keywords||[]).join('\n'))}</textarea><div class="mini">${!j&&sug.keywords.length?'Đã gợi ý sẵn '+sug.keywords.length+' từ khoá có nhiều hiển thị nhất từ Search Console.':''}</div></div>
   <div class="field"><label>Độ sâu</label><select id="bt-depth">${[[1,'Top 10 (1 lượt SerpApi / từ khoá)'],[2,'Top 20 (tối đa 2 lượt)'],[3,'Top 30 (tối đa 3 lượt)']].map(o=>`<option value="${o[0]}" ${(c.depth||1)==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
   <div class="field"><label>Vị trí tìm kiếm</label><select id="bt-loc">${[['Hanoi,Hanoi,Vietnam','Hà Nội'],['Ho Chi Minh City,Ho Chi Minh City,Vietnam','TP. Hồ Chí Minh'],['Da Nang,Da Nang,Vietnam','Đà Nẵng'],['Vietnam','Toàn Việt Nam']].map(o=>`<option value="${o[0]}" ${(c.location||'Hanoi,Hanoi,Vietnam')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`
  :`<div class="field"><label>Địa chỉ website (mỗi dòng 1 địa chỉ, tối đa 10)</label><textarea id="bt-urls" rows="5" placeholder="https://doithu.vn&#10;https://webseo.com.vn/bang-gia/">${esc((c.urls||(DB.competitors||[]).filter(x=>x.website).map(x=>x.website)).join('\n'))}</textarea></div>
   <div class="field"><label>Thiết bị</label><select id="bt-dev">${[['both','Máy tính + điện thoại'],['desktop','Máy tính'],['mobile','Điện thoại']].map(o=>`<option value="${o[0]}" ${(c.device||'both')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`}
  ${j?`<label class="dleg" style="cursor:pointer"><input type="checkbox" id="bt-en" style="width:auto" ${j.enabled?'checked':''}> Đang bật</label>`:''}
 </div><div class="mf"><button class="btn" onclick="closeLayer()">Huỷ</button><button class="btn primary" onclick="botSave('${id||''}','${kind}')">${ic('check')} Lưu</button></div>`);
}
async function botSave(id,kind){
 const v=s=>($(s)||{}).value||'';
 const body={action:'save',id,kind,name:v('#bt-name'),schedule:v('#bt-sch'),enabled:id?(($('#bt-en')||{}).checked?1:0):1,config:kind==='rank'?{domain:v('#bt-dom'),keywords:v('#bt-kw'),location:v('#bt-loc'),depth:+v('#bt-depth')||1}:{urls:v('#bt-urls'),device:v('#bt-dev')}};
 try{const d=await apiPost('/api/bot.php',body);closeLayer();BOT.loaded=false;await botLoad();toast('Đã lưu','Bấm Chạy ngay để lấy kết quả đầu tiên');if(!id)botRun(d.id)}catch(e){toast('Lỗi',e.message)}
}
async function botRun(id){BOT.busy[id]=true;render();let prev=null;
 try{const d=await apiPost('/api/bot.php',{action:'run',id});prev=d.prev_run_at;toast('Robot đang chạy nền','Kết quả tự hiện khi xong (thường 10 giây – vài phút)')}catch(e){toast('Lỗi',e.message);delete BOT.busy[id];render();return}
 for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,8000));try{const h=await apiGet('/api/bot.php?id='+encodeURIComponent(id)+'&history=1');if(h.job.last_run_at!==prev&&h.job.last_status!=='running'){BOT.hist[id]=h;toast(h.job.last_status==='error'?'Robot gặp lỗi':'Robot chạy xong',(h.job.last||{}).error||'');break}}catch(e){}}
 delete BOT.busy[id];BOT.loaded=false;await botLoad()}
async function botDel(id){if(!confirm('Xoá việc này và toàn bộ lịch sử?'))return;try{await apiPost('/api/bot.php',{action:'delete',id});BOT.loaded=false;botLoad()}catch(e){toast('Lỗi',e.message)}}

function pgContent(){
 const t=tabOf('content','pipe');

 else if(t==='studio'){body=studioHtml()}
 else {body=`<div class="card"><div class="card-b"><div class="empty" style="padding:36px 20px"><div class="ei">${ic('palette')}</div><h4>Chưa có asset</h4><div class="mini">Ảnh / video tải lên khi soạn bài ở Đăng bài đa kênh sẽ dùng lại được từ đó.</div></div></div></div>`;}
